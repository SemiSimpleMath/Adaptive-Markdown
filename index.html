<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Adaptive Markdown</title>

<link rel="icon" type="image/svg+xml" href="/favicon.svg">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/markdown-it@13.0.2/dist/markdown-it.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/markdown-it-container@4.0.0/dist/markdown-it-container.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/markdown-it-attrs@4.1.6/markdown-it-attrs.browser.js"></script>
<script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>

<style>
:root {
  --bg: #fafaf7;
  --side-bg: #ffffff;
  --text: #1a1a1a;
  --muted: #666;
  --accent: #2a4d7a;
  --accent-soft: #eef2f7;
  --border: #d8d8d0;
  --theorem-bd: #2a4d7a;
  --theorem-bg: #eef2f7;
  --def-bd: #c39548;
  --def-bg: #f4f0e8;
  --example-bd: #6a9255;
  --example-bg: #f0f6ef;
  --remark-bd: #999;
  --remark-bg: #f3f3ee;
  --error: #b34141;
  --tool-bg: #f0efe9;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; }
body {
  font-family: 'Charter', 'Iowan Old Style', Georgia, serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.55;
}

/* Split-pane layout */
.app {
  display: flex;
  height: 100vh;
}
.resizer {
  width: 6px;
  background: transparent;
  cursor: col-resize;
  flex-shrink: 0;
  position: relative;
}
.resizer::after {
  content: '';
  position: absolute;
  left: 50%;
  top: 0;
  bottom: 0;
  width: 1px;
  background: var(--border);
  transition: background 0.15s, width 0.15s;
}
.resizer:hover::after, .resizer.dragging::after {
  width: 2px;
  background: var(--accent);
}
.doc-pane {
  flex: 1 1 0;
  display: flex;
  flex-direction: column;
  background: var(--bg);
  min-width: 200px;
  min-height: 0;
  position: relative;
  overflow: hidden;
}
#doc-frame {
  flex: 1 1 0;
  width: 100%;
  border: 0;
  display: block;
  background: #fff;
}
.doc-pane .scroll {
  flex: 1 1 0;
  min-height: 0;
  overflow-y: auto;
}
.doc-pane main {
  max-width: 760px;
  margin: 0 auto;
  padding: 2.5rem 1.5rem 4rem;
}
.view-tabs {
  display: flex;
  align-items: stretch;
  background: #ececea;
  border-bottom: 1px solid var(--border);
  padding: 0 0.5rem;
  gap: 0.5rem;
  flex-shrink: 0;
}
.view-tab-buttons {
  display: flex;
  gap: 1px;
  flex: 1 1 auto;
}
.view-tabs #doc-select {
  max-width: 240px;
  align-self: center;
}
.view-tabs #reset-doc-btn { align-self: center; }
.history-wrap { position: relative; align-self: center; }
.new-doc-overlay {
  position: absolute;
  inset: 0;
  background: white;        /* opaque — hides the previous doc */
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  z-index: 60;
  cursor: default;
}
/* Re-assert display:none against [hidden] (the class rule above otherwise wins
   over the user-agent rule). */
.new-doc-overlay[hidden] { display: none; }
/* A large inset dashed border defines the whole drop area visually. */
.new-doc-overlay::before {
  content: '';
  position: absolute;
  inset: 1rem;
  border: 3px dashed var(--border);
  border-radius: 10px;
  pointer-events: none;
  transition: border-color 0.15s, background-color 0.15s;
}
.new-doc-overlay.dropping::before {
  border-color: var(--accent);
  background: var(--accent-soft);
}
.new-doc-card {
  text-align: center;
  user-select: none;
  display: flex;
  flex-direction: column;
  gap: 0.7rem;
  align-items: center;
  position: relative;       /* lifts above ::before */
  z-index: 1;
  padding: 1rem 2rem;
}
.new-doc-card strong {
  font-size: 1.6rem; color: var(--accent); font-weight: 600;
  letter-spacing: 0.005em;
}
.new-doc-card .new-doc-hint {
  font-size: 0.95rem; color: var(--muted); line-height: 1.5;
  max-width: 460px;
}
.new-doc-card .new-doc-actions {
  display: flex; gap: 0.6rem; justify-content: center; margin-top: 0.4rem;
  align-items: center;
}
.new-doc-card .btn-primary {
  background: var(--accent); color: white; border: 0;
  padding: 0.55rem 1.3rem; border-radius: 4px;
  font: inherit; font-size: 0.92rem; cursor: pointer; font-weight: 600;
}
.new-doc-card .btn-primary:hover { filter: brightness(1.1); }
.new-doc-card .new-doc-dismiss {
  font-size: 0.75rem; color: var(--muted); margin-top: 0.6rem;
  letter-spacing: 0.01em;
}
.history-panel {
  position: absolute;
  top: calc(100% + 6px);
  right: 0;
  background: white;
  border: 1px solid var(--border);
  border-radius: 4px;
  box-shadow: 0 6px 16px rgba(0,0,0,0.12);
  min-width: 280px;
  max-width: 400px;
  max-height: 340px;
  overflow-y: auto;
  z-index: 100;
  font-size: 0.8rem;
}
.history-panel .history-empty {
  padding: 1rem; color: var(--muted); text-align: center; font-style: italic;
}
.history-panel button.history-row {
  display: flex;
  width: 100%;
  align-items: baseline;
  gap: 0.6rem;
  padding: 0.5rem 0.8rem;
  background: white;
  border: 0; border-bottom: 1px solid var(--border);
  font: inherit; font-size: 0.8rem;
  text-align: left; cursor: pointer; color: inherit;
}
.history-panel button.history-row:hover { background: var(--accent-soft); }
.history-panel button.history-row:last-child { border-bottom: 0; }
.history-panel .history-row-ts { flex: 1 1 auto; }
.history-panel .history-row-size { color: var(--muted); font-family: ui-monospace, monospace; font-size: 0.75rem; }
.view-tab {
  padding: 0.4rem 0.95rem;
  background: transparent; border: 0;
  cursor: pointer; font: inherit; font-size: 0.82rem;
  color: var(--muted);
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
}
.view-tab:hover { color: var(--accent); }
.view-tab.active {
  background: var(--bg); color: var(--accent);
  border-bottom-color: var(--accent); font-weight: 600;
}
.view-source {
  font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  font-size: 0.85rem;
  white-space: pre-wrap;
  background: white;
  border: 1px solid var(--border);
  padding: 1rem;
  border-radius: 4px;
}
.view-graph { width: 100%; height: calc(100vh - 110px); display: block; cursor: grab; }
.view-graph:active { cursor: grabbing; }
.view-stub {
  padding: 2rem; color: var(--muted); font-style: italic;
  text-align: center;
}

@media print {
  .chat-pane, .view-tabs { display: none !important; }
  .doc-pane { border: 0; }
  body { background: white; color: black; }
  .kind-theorem, .kind-lemma, .kind-proposition, .kind-corollary,
  .kind-definition, .kind-example, .kind-proof, .kind-solution {
    page-break-inside: avoid;
    background: transparent !important;
    border-left: 2px solid #000 !important;
  }
  h1, h2, h3, h4 { page-break-after: avoid; }
}

/* Frontmatter header */
.frontmatter {
  border-bottom: 1px solid var(--border);
  padding-bottom: 1.25rem;
  margin-bottom: 2rem;
}
.frontmatter h1 { margin: 0 0 .25rem; font-size: 1.8rem; font-weight: 700; }
.frontmatter .meta { color: var(--muted); font-size: .85rem; font-style: italic; }

/* Article body */
article h1, article h2, article h3, article h4 {
  font-weight: 600;
  margin-top: 2rem;
  margin-bottom: .5rem;
}
article h2 { font-size: 1.35rem; }
article h3 { font-size: 1.15rem; }
article h4 { font-size: 1rem;    }

/* Heading-based block styling */
.kind-theorem, .kind-lemma, .kind-proposition, .kind-corollary {
  background: var(--theorem-bg);
  border-left: 3px solid var(--theorem-bd);
  padding: .5rem .75rem;
  margin-top: 1.75rem !important;
}
.kind-definition {
  background: var(--def-bg);
  border-left: 3px solid var(--def-bd);
  padding: .5rem .75rem;
}
.kind-example {
  background: var(--example-bg);
  border-left: 3px solid var(--example-bd);
  padding: .5rem .75rem;
}
.kind-remark, .kind-note, .kind-aside { font-style: italic; color: var(--muted); }
.kind-proof, .kind-solution { color: #444; margin-top: 1rem !important; }
.kind-abstract {
  background: var(--remark-bg);
  border-left: 3px solid var(--remark-bd);
  padding: .65rem .9rem;
  font-size: 0.95rem;
}

a[href^="#"] { color: var(--accent); text-decoration: none; }
a[href^="#"]:hover { text-decoration: underline; }

/* Directive blocks */
.directive { margin: 1.5rem 0; padding: 1rem 1.25rem; border-radius: 4px; }
.directive.figure {
  background: white;
  border: 2px dashed var(--border);
  text-align: center;
}
.directive.figure .figure-intent { font-style: italic; color: #333; }
/* Hide intent caption once the figure has rendered content (matching the
   iframe srcdoc rule). Caption is a placeholder affordance only. */
.directive.figure:has(canvas, svg, img, video, audio, iframe, .desmos-container, picture, table) .figure-intent {
  display: none;
}
.directive.pinned { background: #fffaf3; border-left: 3px solid #c39548; }
.directive.pinned::before {
  content: "🔒 pinned";
  display: block;
  font-size: .7rem; text-transform: uppercase; letter-spacing: .08em;
  color: var(--muted); margin-bottom: .35rem;
}

ol, ul { padding-left: 1.5rem; }
li { margin: .25rem 0; }
code { background: #ececec; padding: 1px 4px; border-radius: 3px; font-size: .9em; }
pre code { display: block; padding: .75rem; overflow-x: auto; }
.katex-display { margin: 1rem 0; overflow-x: auto; overflow-y: hidden; }

/* Selection */
.hover-block {
  outline: 1px dashed #999;
  outline-offset: 3px;
  cursor: pointer;
}
.selected-block {
  outline: 2px solid var(--accent) !important;
  outline-offset: 4px;
  border-radius: 4px;
}

/* Chat pane */
.chat-pane {
  display: flex;
  flex-direction: column;
  background: var(--side-bg);
  width: 420px;
  min-width: 280px;
  max-width: 60vw;
  flex-shrink: 0;
  min-height: 0;
  height: 100vh;
  overflow: hidden;
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
}
.chat-header {
  padding: 0.5rem 0.75rem;
  border-bottom: 1px solid var(--border);
  font-size: 0.78rem;
  color: var(--muted);
  display: flex;
  align-items: center;
  gap: 0.4rem;
  flex-shrink: 0;
  flex-wrap: wrap;
  row-gap: 0.35rem;
}
.chat-header #status {
  flex: 0 1 auto;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.chat-header .doc-label { font-family: ui-monospace, monospace; }
.header-right {
  display: flex;
  align-items: center;
  gap: 0.35rem;
  margin-left: auto;
  flex-wrap: wrap;
  min-width: 0;
}
.btn-tiny {
  background: transparent; border: 1px solid var(--border);
  color: var(--muted); font: inherit; font-size: 0.78rem;
  padding: 0.15rem 0.55rem; border-radius: 4px; cursor: pointer;
}
.btn-tiny:hover { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }

.doc-select {
  background: white; border: 1px solid var(--border);
  padding: 0.18rem 0.4rem; border-radius: 4px;
  font: inherit; font-size: 0.78rem; font-family: ui-monospace, monospace;
  color: var(--muted); cursor: pointer;
  max-width: 220px;
  min-width: 0;
  flex-shrink: 1;
  text-overflow: ellipsis;
}

.chat-log {
  flex: 1 1 0;
  min-height: 0;
  overflow-y: auto;
  overscroll-behavior: contain;
  padding: 1rem;
  font-size: 0.93rem;
  line-height: 1.5;
}
.msg { margin-bottom: 1rem; }
.msg-role {
  font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.08em;
  color: var(--muted); margin-bottom: 0.2rem;
}
.msg.user .msg-role { color: var(--accent); }
.msg.user .msg-text {
  background: var(--accent-soft);
  padding: 0.5rem 0.75rem;
  border-radius: 6px;
}
.msg-text { white-space: pre-wrap; word-wrap: break-word; }
.msg.error .msg-role, .msg.error .msg-text { color: var(--error); }

/* Assistant messages render as markdown — give them readable typography */
.msg.assistant .msg-text { white-space: normal; }
.msg.assistant .msg-text > *:first-child { margin-top: 0; }
.msg.assistant .msg-text > *:last-child { margin-bottom: 0; }
.msg.assistant .msg-text h1,
.msg.assistant .msg-text h2,
.msg.assistant .msg-text h3,
.msg.assistant .msg-text h4,
.msg.assistant .msg-text h5,
.msg.assistant .msg-text h6 {
  font-family: ui-sans-serif, system-ui, sans-serif;
  font-weight: 600;
  margin: 0.7em 0 0.3em;
  line-height: 1.3;
  color: var(--fg);
}
.msg.assistant .msg-text h1 { font-size: 1.12rem; }
.msg.assistant .msg-text h2 { font-size: 1.04rem; }
.msg.assistant .msg-text h3 { font-size: 0.96rem; }
.msg.assistant .msg-text h4,
.msg.assistant .msg-text h5,
.msg.assistant .msg-text h6 { font-size: 0.9rem; }
.msg.assistant .msg-text p { margin: 0.45em 0; }
.msg.assistant .msg-text ul,
.msg.assistant .msg-text ol {
  padding-left: 1.4em; margin: 0.4em 0;
}
.msg.assistant .msg-text li { margin: 0.15em 0; }
.msg.assistant .msg-text li > p:first-child { margin-top: 0; }
.msg.assistant .msg-text li > p:last-child { margin-bottom: 0; }
.msg.assistant .msg-text code {
  background: var(--bg);
  border: 1px solid var(--border);
  padding: 0.04em 0.32em;
  border-radius: 3px;
  font-size: 0.85em;
  font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
.msg.assistant .msg-text pre {
  background: var(--bg);
  border: 1px solid var(--border);
  padding: 0.55em 0.75em;
  border-radius: 4px;
  overflow-x: auto;
  font-size: 0.8em;
  margin: 0.5em 0;
  line-height: 1.45;
}
.msg.assistant .msg-text pre code {
  background: transparent; border: 0; padding: 0; font-size: 1em;
}
.msg.assistant .msg-text blockquote {
  margin: 0.5em 0;
  padding: 0.25em 0.7em;
  border-left: 3px solid var(--border);
  color: var(--muted);
}
.msg.assistant .msg-text strong { font-weight: 600; color: var(--fg); }
/* When the agent puts a bare label on its own line (e.g. **Before:**, **After:**,
   **Note:**, **Edit:**), markdown-it produces <p><strong>Label</strong></p>.
   Style that pattern as a small chip so it visually separates the chunks below. */
.msg.assistant .msg-text p > strong:first-child:last-child {
  display: inline-block;
  margin: 0.5em 0 0.15em;
  padding: 0.1em 0.55em;
  background: var(--accent-soft);
  color: var(--accent);
  border-radius: 999px;
  font-size: 0.78rem;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  font-weight: 600;
}
.msg.assistant .msg-text p:has(> strong:first-child:last-child) {
  margin: 0;
}
.msg.assistant .msg-text em { font-style: italic; }
.msg.assistant .msg-text a { color: var(--accent); }
.msg.assistant .msg-text hr {
  border: 0; border-top: 1px solid var(--border); margin: 0.8em 0;
}
.msg.assistant .msg-text table {
  border-collapse: collapse; margin: 0.5em 0; font-size: 0.88em;
}
.msg.assistant .msg-text th,
.msg.assistant .msg-text td {
  border: 1px solid var(--border); padding: 0.25em 0.55em;
}
.msg.assistant .msg-text th { background: var(--accent-soft); font-weight: 600; }

.activity {
  display: flex; align-items: center; gap: 0.5rem;
  font-size: 0.88rem; color: var(--muted); font-style: italic;
  padding: 0.4rem 0;
}
.activity .activity-text {
  flex: 1; min-width: 0; overflow: hidden;
  text-overflow: ellipsis; white-space: nowrap;
}
.activity::before {
  content: "";
  display: inline-block;
  width: 9px; height: 9px; border-radius: 50%;
  background: var(--accent);
  animation: am-pulse 1.4s ease-in-out infinite;
  flex-shrink: 0;
}
@keyframes am-pulse {
  0%, 100% { opacity: 0.3; transform: scale(0.8); }
  50%      { opacity: 1;   transform: scale(1.1); }
}

.selection-bar {
  display: none;
  padding: 0.4rem 0.75rem;
  background: var(--accent-soft);
  border-top: 1px solid var(--border);
  font-size: 0.82rem; color: var(--accent);
  align-items: center; gap: 0.4rem;
  flex-shrink: 0;
}
.selection-bar.visible { display: flex; }
.selection-bar .selection-label {
  flex: 1; font-family: ui-monospace, monospace;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.selection-bar .selection-clear {
  background: transparent; border: 0; color: var(--accent);
  cursor: pointer; font-size: 1rem; padding: 0 0.25rem; line-height: 1;
}
.selection-bar .selection-clear:hover { color: var(--error); }

.input-row {
  display: flex; padding: 0.75rem; border-top: 1px solid var(--border);
  gap: 0.5rem; flex-shrink: 0;
}
.input-row textarea {
  flex: 1; resize: none; font: inherit;
  padding: 0.5rem; border: 1px solid var(--border); border-radius: 4px;
  background: white;
}
.input-row button {
  padding: 0 1rem; background: var(--accent); color: white;
  border: 0; border-radius: 4px; cursor: pointer; font: inherit;
}
.input-row button:disabled { background: var(--muted); cursor: default; }

.error-banner {
  background: #fdecec; border: 1px solid #d4a4a4; border-radius: 4px;
  padding: .75rem 1rem; color: #8a2a2a;
  font-family: ui-monospace, monospace; font-size: .85rem;
  white-space: pre-wrap;
}
</style>
</head>
<body>
<div class="app">
  <div class="doc-pane" id="doc-pane">
    <div class="view-tabs" id="view-tabs">
      <div class="view-tab-buttons" id="view-tab-buttons"></div>
      <select id="doc-select" class="doc-select" title="Switch document"></select>
      <button id="new-doc-btn" class="btn-tiny" title="Add a new document — drop a file or browse">＋ Doc</button>
      <button id="undo-btn" class="btn-tiny" title="Revert to the state before the last edit">↶ Undo</button>
      <div class="history-wrap">
        <button id="history-btn" class="btn-tiny" title="Browse pre-edit snapshots and restore an earlier version">History</button>
        <div id="history-panel" class="history-panel" hidden></div>
      </div>
      <button id="reset-doc-btn" class="btn-tiny" title="Restore this document to its ship-with original">↺ Reset</button>
    </div>
    <iframe id="doc-frame" sandbox="allow-scripts allow-same-origin allow-popups" title="Document"></iframe>
    <div id="new-doc-overlay" class="new-doc-overlay" hidden>
      <div class="new-doc-card">
        <strong>Drop a file to import</strong>
        <div class="new-doc-hint">.md, .tex, .txt, .rst, .org — or any text-ish file (you'll be asked to confirm unfamiliar formats)</div>
        <div class="new-doc-actions">
          <button id="new-doc-choose" class="btn-primary" type="button">Choose file…</button>
          <button id="new-doc-close" class="btn-tiny" type="button">Cancel</button>
        </div>
        <div class="new-doc-dismiss">Drop anywhere in this area · or click anywhere to browse · Esc / Cancel to close</div>
      </div>
    </div>
    <input type="file" id="new-doc-input" style="display:none;">
    <div class="scroll" id="doc-scroll" hidden>
      <main>
        <header class="frontmatter" id="frontmatter"></header>
        <article id="body"></article>
      </main>
    </div>
  </div>
  <div class="resizer" id="resizer" title="Drag to resize"></div>
  <aside class="chat-pane" id="chat-pane">
    <div class="chat-header">
      <span id="status">connecting...</span>
      <div class="header-right">
        <select id="model-select" class="doc-select" title="Model (switching resets conversation)"></select>
        <button id="new-chat-btn" class="btn-tiny" title="Fresh conversation">＋ New</button>
      </div>
    </div>
    <div class="chat-log" id="log"></div>
    <div class="selection-bar" id="selection-bar">
      <span>📍</span>
      <span class="selection-label" id="selection-label"></span>
      <button class="selection-clear" id="selection-clear" title="Clear focus">×</button>
    </div>
    <div class="input-row">
      <textarea id="input" rows="3" placeholder="Ask the document anything..."></textarea>
      <button id="send" disabled>Send</button>
    </div>
  </aside>
</div>

<script>
(function () {
  'use strict';

  // ---- Reserved heading words ---------------------------------------------
  const KIND_WORDS = new Set([
    'theorem', 'lemma', 'proposition', 'corollary',
    'definition', 'example', 'remark', 'note', 'aside',
    'proof', 'solution', 'abstract',
  ]);

  // ---- DOM refs -----------------------------------------------------------
  const body = document.getElementById('body');
  const frontmatterEl = document.getElementById('frontmatter');
  const docPane = document.getElementById('doc-pane');

  // ---- View tabs ----------------------------------------------------------
  const VIEW_TYPES = [

  // ---- Frontmatter / markdown ---------------------------------------------
  function splitFrontmatter(text) {
    const m = text.match(/^---\r?\n([\s\S]*?)\r?\n---\r?\n/);
    if (!m) return { frontmatter: {}, body: text };
    let fm = {};
    try { fm = window.jsyaml.load(m[1]) || {}; } catch (e) { /* ignore */ }
    return { frontmatter: fm, body: text.slice(m[0].length) };
  }

  function parseDirectiveInfo(info) {
    const m = info.trim().match(/^(\w[\w-]*)\s*(?:\{([^}]*)\})?$/);
    if (!m) return { name: null, attrs: {} };
    const name = m[1].toLowerCase();
    const attrStr = (m[2] || '').trim();
    const attrs = {};
    const re = /(\w[\w-]*)\s*=\s*("([^"]*)"|([^\s"]+))/g;
    let am;
    while ((am = re.exec(attrStr)) !== null) {
      attrs[am[1]] = am[3] !== undefined ? am[3] : am[4];
    }
    return { name, attrs };
  }

  function escapeAttr(s) {
    return String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;')
                    .replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
  function escapeHtml(s) { return escapeAttr(s); }

  function registerContainer(md, name, render) {
    md.use(window.markdownitContainer, name, {
      validate(params) {
        const p = parseDirectiveInfo(params);
        return p.name === name;
      },
      render(tokens, idx) {
        const t = tokens[idx];
        if (t.nesting === 1) {
          const { attrs } = parseDirectiveInfo(t.info);
          return render(attrs, true);
        }
        return render(null, false);
      },
    });
  }

  function buildMd() {
    const md = window.markdownit({
      // typographer OFF — it converts straight apostrophes to curly,
      // which breaks KaTeX's prime notation (f' becomes f' which KaTeX
      // doesn't recognize as a derivative).
      html: true, linkify: true, breaks: false, typographer: false,
    }).use(window.markdownItAttrs);

    for (const kind of ['theorem', 'lemma', 'proposition', 'corollary',
                        'definition', 'example', 'remark', 'note', 'aside',
                        'proof', 'solution', 'abstract']) {
      registerContainer(md, kind, (attrs, open) => {
        if (open) {
          const id = attrs && attrs.id ? ` id="${escapeAttr(attrs.id)}"` : '';
          const name = attrs && attrs.name ? ` data-name="${escapeAttr(attrs.name)}"` : '';
          return `<section class="kind-${kind} kind-block"${id}${name}>\n`;
        }
        return `</section>\n`;
      });
    }

    registerContainer(md, 'figure', (attrs, open) => {
      if (open) {
        const renderer = attrs && attrs.renderer ? attrs.renderer : 'svg';
        const intent = attrs && attrs.intent ? attrs.intent : '';
        // The intent text is rendered as a caption only when the figure body
        // is empty (CSS `:has()` rule hides it once real content is inside).
        // Always set aria-label so screen readers have the description, even
        // when the visible caption is hidden behind the rendered figure.
        const aria = intent ? ` aria-label="${escapeAttr(intent)}"` : '';
        return (
          `<div class="directive figure" data-renderer="${escapeAttr(renderer)}"${aria}>` +
          (intent ? `<div class="figure-intent">${escapeHtml(intent)}</div>` : '') +
          `<div class="figure-body">`
        );
      }
      return `</div></div>\n`;
    });

    registerContainer(md, 'pinned', (attrs, open) => {
      return open ? `<div class="directive pinned">\n` : `</div>\n`;
    });

    // Catch-all: any directive whose name isn't one of the specific names
    // above must still render as a plain `<div class="directive NAME">`,
    // never leak its `:::` markers into the rendered DOM. Matches the
    // contract FORMAT.md states ("any other directive name renders as a
    // div with that class"). Registered last so specific handlers take
    // precedence on their own names.
    const KNOWN_DIRECTIVES = new Set([
      'theorem', 'lemma', 'proposition', 'corollary',
      'definition', 'example', 'remark', 'note', 'aside',
      'proof', 'solution', 'abstract',
      'figure', 'pinned',
    ]);
    md.use(window.markdownitContainer, 'directive_unknown', {
      validate(params) {
        const p = parseDirectiveInfo(params);
        return !!p.name && !KNOWN_DIRECTIVES.has(p.name);
      },
      render(tokens, idx) {
        const t = tokens[idx];
        if (t.nesting === 1) {
          const { name, attrs } = parseDirectiveInfo(t.info);
          const id = attrs && attrs.id ? ` id="${escapeAttr(attrs.id)}"` : '';
          return `<div class="directive ${escapeAttr(name)}"${id}>\n`;
        }
        return `</div>\n`;
      },
    });

    return md;
  }
  const md = buildMd();

  function annotateHeadings(article) {
    article.querySelectorAll('h1, h2, h3, h4, h5, h6').forEach(h => {
      const text = h.textContent.trim();
      const firstWord = (text.match(/^(\w+)/) || [])[1];
      if (firstWord) {
        const kind = firstWord.toLowerCase();
        if (KIND_WORDS.has(kind)) {
          h.classList.add('kind-' + kind);
          h.dataset.kind = kind;
        }
      }
    });
  }

  // Walk for `<!-- id:b-... -->` HTML comments and propagate the tracking ID
  // to the immediately following element as data-track-id. Comments without
  // a following element (or with the wrong format) are ignored.
  const TRACK_ID_RE = /^\s*id\s*:\s*(b-[A-Z0-9-]+)\s*$/i;
  function attachTrackingIds(container) {
    const walker = container.ownerDocument.createTreeWalker(
      container, NodeFilter.SHOW_COMMENT
    );
    const comments = [];
    let n;
    while ((n = walker.nextNode())) comments.push(n);
    for (const c of comments) {
      const m = c.textContent.match(TRACK_ID_RE);
      if (!m) continue;
      const id = m[1];
      // Find the next ELEMENT sibling — skip text nodes and other comments.
      let sib = c.nextSibling;
      while (sib && sib.nodeType !== 1) sib = sib.nextSibling;
      if (!sib) continue;
      sib.dataset.trackId = id;
    }
  }

  function renderFrontmatter(fm) {
    // Frontmatter `title` is metadata (browser tab). The body's H1 is the
    // visible page title; rendering both would duplicate.
    frontmatterEl.innerHTML = '';
    const metaBits = [];
    const a = fm.authors || fm.author;
    if (a) metaBits.push(Array.isArray(a) ? a.join(', ') : a);
    if (fm.audience) metaBits.push('audience: ' + fm.audience);
    if (fm.language) metaBits.push('language: ' + fm.language);
    if (metaBits.length) {
      const d = document.createElement('div');
      d.className = 'meta';
      d.textContent = metaBits.join(' · ');
      frontmatterEl.appendChild(d);
    }
    document.title = fm.title ? (fm.title + ' — Adaptive Markdown') : 'Adaptive Markdown';
  }

  function renderMath() {
    if (window.renderMathInElement) {
      window.renderMathInElement(body, {
        delimiters: [
          { left: '$$', right: '$$', display: true },

        throwOnError: false,
        ignoredTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code'],
      });
    } else {
      setTimeout(renderMath, 60);
    }
  }

      'const TRACK_ID_RE=/^\\s*id\\s*:\\s*(b-[A-Z0-9-]+)\\s*$/i;',

  function initIframe() {
    docFrameReady = false;
    docFrame.srcdoc = buildIframeSrcdoc();
  }

  function sendToFrame(msg) {
    if (!docFrameReady || !docFrame.contentWindow) {
      if (msg && msg.type === 'setContent') pendingFrameContent = msg;
      return;
    }
    docFrame.contentWindow.postMessage(msg, '*');
  }

  window.addEventListener('message', (e) => {
    if (!docFrame || e.source !== docFrame.contentWindow) return;
    const data = e.data || {};
    if (data.type === 'iframeReady') {
      docFrameReady = true;
      if (pendingFrameContent) {
        const m = pendingFrameContent; pendingFrameContent = null;
        sendToFrame(m);
      }
      // Replay current selection state to the iframe
      if (currentSelections && currentSelections.length) {
        sendToFrame({ type: 'setSelections', selections: currentSelections });
      }
    } else if (data.type === 'selection') {
      // A click inside the iframe — also treat as "click outside the panel".
      if (historyPanel && !historyPanel.hidden) historyPanel.hidden = true;
      handleFrameSelection(data.block, !!data.additive);
    } else if (data.type === 'fileDropped') {
      handleFrameDrop(data.files);
    } else if (data.type === 'dragenter') {
      // mirror drop overlay onto parent so the dashed border shows
      document.body.classList.add('dropping');
    }
  });

  // Stable dedup key for a selection. When the block has no id yet
  // (unlabeled paragraph, no anchor, no track-id minted), falling back to
  // bare `(s.id || '')` collapses all unlabeled blocks to the same empty
  // key — additive clicks then incorrectly toggle each other off. Fall
  // back to label+excerpt instead.
  function selKey(s) {
    if (s && s.id) return s.id;
    const label = (s && s.label) || '';
    const excerpt = (s && s.excerpt) || '';
    return `_unlabeled:${label.slice(0, 80)}|${excerpt.slice(0, 200)}`;
  }

  function handleFrameSelection(info, additive) {
    if (!info) {
      if (currentSelections.length > 0) setSelections([]);
      return;
    }
    const newSel = {
      id: info.id, track_id: info.track_id, anchor_id: info.anchor_id,
      label: info.label, excerpt: info.excerpt, element: null,
    };
    let newList;
    if (!additive) {
      newList = [newSel];
    } else {
      const newKey = selKey(newSel);
      const dupIdx = currentSelections.findIndex(s => selKey(s) === newKey);
      if (dupIdx >= 0) {
        newList = currentSelections.filter((_, i) => i !== dupIdx);
      } else {
        newList = [...currentSelections, newSel];
      }
    }
    setSelections(newList);
  }

  // Single import path used by every drop / file-pick site (iframe drop,
  // + Doc overlay, file input, parent body drop). Prompts the user for
  // confirmation when the extension isn't in the well-known set.
  async function importFile(file) {
    document.body.classList.remove('dropping');
    if (newDocOverlay && !newDocOverlay.hidden) hideNewDocOverlay();
    if (!file) return;
    const lower = (file.name || '').toLowerCase();
    const dot = lower.lastIndexOf('.');
    const ext = dot >= 0 ? lower.slice(dot) : '';
    let allowUnknown = false;
    if (!SUPPORTED_DROP_EXTS.includes(ext)) {
      const proceed = confirm(
        '"' + file.name + '" has an unfamiliar extension (' + (ext || 'none') + ').\n\n' +
        'Should the agent try to convert it to adaptive markdown anyway?\n' +
        'It will read the file as text and do its best. Binary formats ' +
        '(PDF, images, video) likely will not convert cleanly.'
      );
      if (!proceed) return;
      allowUnknown = true;
    }
    const form = new FormData();
    form.append('file', file);
    const url = '/upload' + (allowUnknown ? '?allow_unknown=1' : '');
    try {
      const resp = await fetch(url, { method: 'POST', body: form });
      if (!resp.ok) {
        let msg = `upload failed: ${resp.status}`;
        try { const j = await resp.json(); if (j.error) msg = j.error; } catch (_) {}
        appendMessage('error', msg);
        return;
      }
      const data = await resp.json();
      if (data.needs_conversion) {
        const kindDesc = data.unknown
          ? 'an unfamiliar ' + (data.kind || '(no extension)') + ' file — the viewer is not sure what this format is'
          : 'a ' + data.kind + ' file';
        const prompt =
          'I just dropped `' + data.path + '` — ' + kindDesc + '. ' +
          'Read it and convert it to adaptive markdown at `' + data.target + '`, ' +
          'following the adaptive-markdown skill conventions. If the format is ' +
          'unfamiliar, do your best to extract structure; if the content is binary ' +
          'or unreadable, say so plainly in chat and stop. Preserve all math, ' +
          'structure, and citations — do not adapt or rewrite content during import. ' +
          'When the file is written, the viewer will switch to it automatically.';
        if (ws && ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({ type: 'chat', text: prompt, model: currentModel }));
          appendMessage('user', 'Imported `' + data.path + '` — converting…');
          showActivity();
        } else {
          appendMessage('error', 'WebSocket not connected — cannot start conversion');
        }
      }
    } catch (err) {
      appendMessage('error', 'upload error: ' + (err.message || err));
    }
  }

  // Back-compat wrapper for the iframe-forwarded path (takes a files array).
  async function handleFrameDrop(files) {
    if (!files || !files.length) return;
    await importFile(files[0]);
  }

  async function loadDoc(path) {
    try {
      const resp = await fetch(path, { cache: 'no-store' });
      if (!resp.ok) throw new Error(`fetch ${path} -> ${resp.status}`);
      currentText = await resp.text();
      // Iframe rebuild policy: only rebuild when scripts are involved, so
      // pure text edits go through as fast in-place DOM patches (the whole
      // point of the iframe-postMessage architecture). Rebuild fires when
      // either the previous doc had scripts (lingering timers/listeners
      // could now interfere with new content) or the new doc has scripts
      // (need a fresh JS context for clean execution). Plain markdown
      // edits with no <script> on either side: just patch the DOM.
      const newHasScripts = /<script[\s>]/i.test(currentText);
      if (lastDocHadScripts || newHasScripts) {
        initIframe();
      }
      lastDocHadScripts = newHasScripts;
      const { frontmatter, body: bodyText } = splitFrontmatter(currentText);
      currentFm = frontmatter;
      currentBody = bodyText;
      renderFrontmatter(frontmatter);
      renderCurrentView();
      setSelections([]);
    } catch (e) {
      body.innerHTML =
        `<div class="error-banner">load failed: ${escapeHtml(e.message || String(e))}</div>`;
    }
  }

  // Math protection — replace $$...$$ and $...$ with sentinels before
  // markdown-it sees them, restore after. Without this, multi-line block
  // math gets split by paragraph breaks and KaTeX can't match delimiters.
  function protectMath(text) {
    const ph = {};
    let i = 0;
    text = text.replace(/\$\$[\s\S]+?\$\$/g, m => {
      const k = '@@MATHB' + (i++) + '@@'; ph[k] = m; return k;
    });
    text = text.replace(/\$[^$\n]+?\$/g, m => {
      const k = '@@MATHI' + (i++) + '@@'; ph[k] = m; return k;
    });
    return { text, ph };
  }
  function restoreMath(html, ph) {
    for (const k in ph) html = html.split(k).join(ph[k]);
    return html;
  }

  function renderCurrentView() {
    if (currentView === 'doc') {
      // Render markdown to HTML in the parent, then ship to the iframe.
      // The iframe owns scripts, KaTeX, click-to-focus, hover, drag-drop, etc.
      docFrame.style.display = 'block';
      docScrollEl.hidden = true;
      const { text: protectedText, ph } = protectMath(currentBody);
      let html = md.render(protectedText);
      html = restoreMath(html, ph);
      const metaBits = [];
      const a = currentFm.authors || currentFm.author;
      if (a) metaBits.push(Array.isArray(a) ? a.join(', ') : a);
      if (currentFm.audience) metaBits.push('audience: ' + currentFm.audience);
      if (currentFm.language) metaBits.push('language: ' + currentFm.language);
      sendToFrame({ type: 'setContent', html, meta: metaBits.join(' · ') });
      return;
    }
    // Alt views render into the original <article id="body"> outside the iframe.
    docFrame.style.display = 'none';
    docScrollEl.hidden = false;
    body.innerHTML = '';
    body.className = '';
    if (currentView === 'source') {
      body.className = 'view-source';
      body.textContent = currentText;
    } else if (currentView === 'graph') {
      renderGraphView();
    } else if (currentView === 'latex') {
      renderLatexView();
    }
  }

  // Re-create <script> elements parsed via innerHTML so they actually execute.
  function activateScripts(container) {
    const scripts = Array.from(container.querySelectorAll('script'));
    for (const oldScript of scripts) {
      const newScript = document.createElement('script');
      for (const attr of Array.from(oldScript.attributes)) {
        newScript.setAttribute(attr.name, attr.value);
      }
      newScript.textContent = oldScript.textContent;
      oldScript.parentNode.replaceChild(newScript, oldScript);
    }
  }

  function renderLatexView() {
    body.className = 'view-source';
    body.textContent = mdToLatex(currentFm, currentBody);
  }

  // ---- LaTeX export (best-effort, AST-light) ------------------------------
  function mdToLatex(fm, bodyText) {
    let out = '';
    out += '\\documentclass[11pt]{article}\n';
    out += '\\usepackage[utf8]{inputenc}\\usepackage{amsmath,amssymb,amsthm,hyperref}\n';
    out += '\\newtheorem{theorem}{Theorem}\n\\newtheorem{lemma}[theorem]{Lemma}\n';
    out += '\\newtheorem{proposition}[theorem]{Proposition}\n\\newtheorem{corollary}[theorem]{Corollary}\n';
    out += '\\theoremstyle{definition}\n\\newtheorem{definition}[theorem]{Definition}\n';
    out += '\\newtheorem{example}[theorem]{Example}\n';
    out += '\\theoremstyle{remark}\n\\newtheorem{remark}[theorem]{Remark}\n\n';
    if (fm.title) out += '\\title{' + (fm.title || '') + '}\n';
    const a = fm.authors || fm.author;
    if (a) out += '\\author{' + (Array.isArray(a) ? a.join(' \\and ') : a) + '}\n';
    out += '\\date{}\n\n\\begin{document}\n\\maketitle\n\n';

    // Best-effort body translation. Headings -> environments; **Proof.** -> proof env;
    // math passes through.
    const lines = bodyText.split('\n');
    let openEnv = null;
    let inProof = false;
    let inList = null; // 'itemize' | 'enumerate' | null

    function closeList() { if (inList) { out += '\\end{' + inList + '}\n'; inList = null; } }
    function closeProof() { if (inProof) { out += '\\end{proof}\n'; inProof = false; } }
    function closeEnv()   { if (openEnv) { out += '\\end{' + openEnv + '}\n'; openEnv = null; } }

    for (const raw of lines) {
      const line = raw.replace(/\s+$/, '');
      const trimmed = line.trim();

      // Heading
      const hm = line.match(/^(#{1,6})\s+(.+?)(?:\s*\{([^}]+)\})?\s*$/);
      if (hm) {
        closeList(); closeProof(); closeEnv();
        const text = hm[2].trim();
        const attrs = hm[3] || '';
        const id = (attrs.match(/#([\w-]+)/) || [])[1];
        const first = (text.match(/^(\w+)/) || [])[1] || '';
        const kind = first.toLowerCase();
        const envMap = { theorem:'theorem', lemma:'lemma', proposition:'proposition',
                         corollary:'corollary', definition:'definition',
                         example:'example', remark:'remark', note:'remark', aside:'remark' };
        if (envMap[kind]) {
          const nameMatch = text.match(/\(([^)]+)\)/);
          const nameOpt = nameMatch ? '[' + nameMatch[1] + ']' : '';
          const label = id ? '\\label{' + id + '}' : '';
          out += '\\begin{' + envMap[kind] + '}' + nameOpt + label + '\n';
          openEnv = envMap[kind];
        } else if (kind === 'abstract') {
          out += '\\begin{abstract}\n'; openEnv = 'abstract';
        } else if (hm[1].length === 1) {
          // # H1 — skip (in \title)
        } else {
          const lvl = hm[1].length;
          const cmd = ['section','subsection','subsubsection','paragraph'][Math.min(lvl-2,3)];
          out += '\\' + cmd + '{' + text + '}\n';
          if (id) out += '\\label{' + id + '}\n';
        }
        continue;
      }
      // Proof / Solution
      const pm = trimmed.match(/^\*\*(Proof|Solution)\.\*\*\s*(.*)$/);
      if (pm) {
        closeList();
        if (pm[1] === 'Proof') { out += '\\begin{proof}\n'; inProof = true; }
        else { out += '\\textbf{Solution.}\n'; }
        if (pm[2]) out += inlineMd2Tex(pm[2]) + '\n';
        continue;
      }
      // **Statement.** — drop the label
      const sm = trimmed.match(/^\*\*Statement\.\*\*\s*(.*)$/);
      if (sm) { closeList(); if (sm[1]) out += inlineMd2Tex(sm[1]) + '\n'; continue; }
      // End-of-proof
      if (trimmed.includes('$\\square$')) {
        const cleaned = line.replace('$\\square$','').replace(/\s+$/, '');
        if (cleaned.trim()) out += inlineMd2Tex(cleaned) + '\n';
        closeProof();
        continue;
      }
      // Bullet
      const bm = trimmed.match(/^[-*+]\s+(.*)$/);
      if (bm) {
        if (inList === 'enumerate') closeList();
        if (!inList) { out += '\\begin{itemize}\n'; inList = 'itemize'; }
        out += '\\item ' + inlineMd2Tex(bm[1]) + '\n';
        continue;
      }
      // Numbered
      const nm = trimmed.match(/^\d+\.\s+(.*)$/);
      if (nm) {
        if (inList === 'itemize') closeList();
        if (!inList) { out += '\\begin{enumerate}\n'; inList = 'enumerate'; }
        out += '\\item ' + inlineMd2Tex(nm[1]) + '\n';
        continue;
      }
      // Blank
      if (trimmed === '') { closeList(); out += '\n'; continue; }
      // Directives / unknowns: pass through as comment
      if (trimmed.startsWith(':::')) { out += '% ' + trimmed + '\n'; continue; }
      out += inlineMd2Tex(trimmed) + '\n';
    }
    closeList(); closeProof(); closeEnv();
    out += '\n\\end{document}\n';
    return out;
  }

  function inlineMd2Tex(s) {
    // Cross-ref [text](#id) → \hyperref[id]{text}
    s = s.replace(/\[([^\]]+)\]\(#([\w-]+)\)/g, '\\hyperref[$2]{$1}');
    // External [text](url) → \href{url}{text}
    s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '\\href{$2}{$1}');
    // Bold **x**, italic *x*, code `x`
    s = s.replace(/\*\*([^*\n]+)\*\*/g, '\\textbf{$1}');
    s = s.replace(/(?<![*\w])\*([^*\n]+)\*(?![*\w])/g, '\\textit{$1}');
    s = s.replace(/`([^`\n]+)`/g, '\\texttt{$1}');
    return s;
  }

  // ---- Graph view (DAG from cross-references) -----------------------------
  function buildGraphData(bodyText) {
    const nodes = [];
    const links = [];
    const ids = new Map();
    const headingRe = /^(#{2,6})\s+(.+?)(?:\s*\{([^}]+)\})?\s*$/gm;
    let m;
    const blocks = [];
    while ((m = headingRe.exec(bodyText)) !== null) {
      const text = m[2].trim();
      const attrs = m[3] || '';
      const id = (attrs.match(/#([\w-]+)/) || [])[1];
      const first = (text.match(/^(\w+)/) || [])[1] || '';
      const kind = first.toLowerCase();
      const KINDS = {
        theorem:'#2a4d7a', lemma:'#4a6db5', proposition:'#7a8db5', corollary:'#6f4d7a',
        definition:'#c39548', example:'#6a9255',
        remark:'#888', note:'#888', aside:'#888',
      };
      if (!KINDS[kind]) continue;
      const useId = id || text.toLowerCase().replace(/[^\w]+/g,'-').replace(/^-|-$/g,'') || ('b-'+blocks.length);
      blocks.push({ id: useId, label: text, kind, color: KINDS[kind], start: m.index + m[0].length });
      ids.set(useId, blocks.length - 1);
    }
    for (let i = 0; i < blocks.length; i++) {
      const b = blocks[i];
      const end = (i+1 < blocks.length) ? blocks[i+1].start : bodyText.length;
      const slice = bodyText.slice(b.start, end);
      const linkRe = /\[([^\]]+)\]\(#([\w-]+)\)/g;
      let lm;
      while ((lm = linkRe.exec(slice)) !== null) {
        if (ids.has(lm[2]) && lm[2] !== b.id) {
          links.push({ source: b.id, target: lm[2] });
        }
      }
      nodes.push({ id: b.id, label: b.label, kind: b.kind, color: b.color });
    }
    return { nodes, links };
  }

  function renderGraphView() {
    const { nodes, links } = buildGraphData(currentBody);
    if (nodes.length === 0) {
      body.innerHTML = '<div class="view-stub">No referenceable blocks in this document. Add reserved-word headings (Theorem, Lemma, Definition, Example, …) with cross-references to populate the graph.</div>';
      return;
    }
    body.innerHTML = '';
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('class', 'view-graph');
    svg.id = 'graph-svg';
    body.appendChild(svg);

    if (!window.d3) {
      const s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js';
      s.onload = () => drawGraph(svg, nodes, links);
      document.head.appendChild(s);
    } else {
      drawGraph(svg, nodes, links);
    }
  }

  function drawGraph(svgEl, nodes, links) {
    const svg = d3.select(svgEl);
    const rect = svgEl.getBoundingClientRect();
    const width = rect.width;
    const height = rect.height;
    svg.selectAll('*').remove();

    svg.append('defs').append('marker')
      .attr('id','arrow').attr('viewBox','0 -5 10 10').attr('refX',24).attr('refY',0)
      .attr('markerWidth',7).attr('markerHeight',7).attr('orient','auto')
      .append('path').attr('d','M0,-5L10,0L0,5').attr('fill','#b8b8b0');

    const container = svg.append('g');
    svg.call(d3.zoom().scaleExtent([0.2, 4]).on('zoom', ev => container.attr('transform', ev.transform)));

    const linkSel = container.append('g').selectAll('line').data(links)
      .enter().append('line')
      .attr('stroke','#b8b8b0').attr('stroke-width', 1.5).attr('marker-end','url(#arrow)');

    const incoming = {};
    links.forEach(l => { incoming[l.target] = (incoming[l.target]||0)+1; });

    const nodeSel = container.append('g').selectAll('g').data(nodes)
      .enter().append('g')
      .call(d3.drag()
        .on('start', (ev,d) => { if (!ev.active) sim.alphaTarget(0.3).restart(); d.fx=d.x; d.fy=d.y; })
        .on('drag',  (ev,d) => { d.fx=ev.x; d.fy=ev.y; })
        .on('end',   (ev,d) => { if (!ev.active) sim.alphaTarget(0); d.fx=null; d.fy=null; }));

    nodeSel.append('circle')
      .attr('r', d => 12 + 4 * (incoming[d.id]||0))
      .attr('fill', d => d.color)
      .attr('stroke','white').attr('stroke-width', 2).style('cursor','pointer')
      .on('click', (ev, d) => {
        currentView = 'doc';
        renderViewTabs();
        renderCurrentView();
        setTimeout(() => {
          sendToFrame({ type: 'scrollToAnchor', id: d.id });
        }, 120);
      });

    nodeSel.append('text')
      .attr('text-anchor','middle')
      .attr('dy', d => -16 - 4 * (incoming[d.id]||0))
      .style('font','12px system-ui').style('fill','#222')
      .text(d => d.label.length > 36 ? d.label.slice(0,34) + '…' : d.label);

    const sim = d3.forceSimulation(nodes)
      .force('link', d3.forceLink(links).id(d => d.id).distance(140))
      .force('charge', d3.forceManyBody().strength(-260))
      .force('x', d3.forceX(width/2).strength(0.06))
      .force('y', d3.forceY(height/2).strength(0.08))
      .force('collide', d3.forceCollide().radius(d => 38 + 4*(incoming[d.id]||0)));

    sim.on('tick', () => {
      linkSel
        .attr('x1', d => d.source.x).attr('y1', d => d.source.y)
        .attr('x2', d => d.target.x).attr('y2', d => d.target.y);
      nodeSel.attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');
    });
  }

  // ---- Selection ----------------------------------------------------------
  const BLOCK_KINDS = ['theorem','lemma','proposition','corollary','definition',
                       'example','proof','solution','remark','note','aside','abstract'];

  function findBlock(el) {
    while (el && el !== body && el.nodeType === 1) {
      if (el.classList) {
        if (el.classList.contains('directive')) return el;
        for (const k of BLOCK_KINDS) {
          if (el.classList.contains('kind-' + k)) return el;
        }
      }
      if (/^H[1-6]$/.test(el.tagName) && el.id) return el;
      el = el.parentElement;
    }
    return null;
  }
  function findBlockOrParagraph(el) {
    const block = findBlock(el);
    if (block) return block;
    while (el && el !== body && el.nodeType === 1) {
      if (el.tagName === 'P' || el.tagName === 'LI' || el.tagName === 'BLOCKQUOTE') return el;
      el = el.parentElement;
    }
    return null;
  }

  function blockInfo(el) {
    // Tracking ID is primary if present (sticky, system-minted). Falls back to
    // the element's id attribute (author-set anchor). Send both so the agent
    // can use whichever is more useful for its task.
    const trackId = el.dataset.trackId || null;
    const anchorId = el.id || null;
    const id = trackId || anchorId;
    const heading = el.matches('h1,h2,h3,h4,h5,h6')
      ? el
      : el.querySelector('h1,h2,h3,h4,h5,h6');
    const label = (heading ? heading.textContent : el.textContent)
      .split('\n')[0].trim().slice(0, 80);
    const excerpt = el.textContent.replace(/\s+/g, ' ').trim().slice(0, 2000);
    return { id, track_id: trackId, anchor_id: anchorId, label, excerpt, element: el };
  }

  function setSelections(list) {
    const wasNonEmpty = currentSelections.length > 0;
    // Clear visual outlines from previous selections (alt views only — the
    // iframe manages its own outline based on the actual element clicked).
    selectedEls.forEach(el => el.classList.remove('selected-block'));
    selectedEls.clear();
    currentSelections = (list || []).filter(s => s && (s.id || s.label || s.excerpt));
    for (const s of currentSelections) {
      if (s.element) {
        s.element.classList.add('selected-block');
        selectedEls.add(s.element);
      }
    }
    if (currentSelections.length > 0) {
      const labels = currentSelections.map(s => s.label || s.id || 'block');
      if (labels.length === 1) {
        selectionLabel.textContent = labels[0];
      } else {
        const head = labels.slice(0, 2).join(', ');
        const tail = labels.length > 2 ? `, +${labels.length - 2} more` : '';
        selectionLabel.textContent = `${labels.length} blocks: ${head}${tail}`;
      }
      selectionBar.classList.add('visible');
    } else {
      selectionBar.classList.remove('visible');
      // Only mirror to the iframe when *clearing* — for additions, the
      // iframe already applied the outline locally on click. Re-sending
      // the new list back to the iframe would clear blocks whose ID we
      // don't know (plain paragraphs without {#anchor} / track_id).
      if (wasNonEmpty) sendToFrame({ type: 'setSelections', selections: [] });
    }
  }

  body.addEventListener('mouseover', (e) => {
    const block = findBlockOrParagraph(e.target);
    if (block && !selectedEls.has(block)) block.classList.add('hover-block');
  });
  body.addEventListener('mouseout', (e) => {
    const block = findBlockOrParagraph(e.target);
    if (block) block.classList.remove('hover-block');
  });
  body.addEventListener('mousedown', (e) => {
    if (e.shiftKey || e.metaKey || e.ctrlKey) {
      const block = findBlockOrParagraph(e.target);
      if (block) e.preventDefault();
    }
  });
  body.addEventListener('click', (e) => {
    const block = findBlockOrParagraph(e.target);
    const additive = e.shiftKey || e.metaKey || e.ctrlKey;
    // Don't intercept clicks on links.
    if (e.target.closest('a')) return;
    if (!block) {
      if (currentSelections.length > 0) setSelections([]);
      return;
    }
    e.preventDefault();
    try { const s = document.getSelection(); if (s) s.removeAllRanges(); } catch (err) {}
    block.classList.remove('hover-block');

    let newList;
    if (!additive) {
      newList = [blockInfo(block)];
    } else if (selectedEls.has(block)) {
      newList = currentSelections.filter(s => s.element !== block);
    } else {
      newList = [...currentSelections, blockInfo(block)];
    }
    setSelections(newList);
  });

  selectionClear.addEventListener('click', () => setSelections([]));

  // ---- WebSocket ----------------------------------------------------------
  function connect() {
    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    ws = new WebSocket(`${proto}//${location.host}/ws`);
    ws.onopen = () => { statusEl.textContent = 'connected'; sendBtn.disabled = false; };
    ws.onclose = () => {
      statusEl.textContent = 'disconnected — reconnecting...';
      sendBtn.disabled = true;
      setTimeout(connect, 1500);
    };
    ws.onerror = () => { statusEl.textContent = 'error'; };
    ws.onmessage = (e) => {
      try { handleMessage(JSON.parse(e.data)); }
      catch (err) { console.warn('bad msg', err); }
    };
  }

  function populateDocs(docs) {
    docSelect.innerHTML = '';
    for (const d of docs) {
      const opt = document.createElement('option');
      opt.value = d;
      opt.textContent = d;
      docSelect.appendChild(opt);
    }
    if (currentDoc) docSelect.value = currentDoc;
  }

  docSelect.addEventListener('change', () => {
    const newDoc = docSelect.value;
    if (!newDoc || newDoc === currentDoc) return;
    currentDoc = newDoc;
    initIframe();  // fresh iframe — drops any timers / listeners agent left behind
    loadDoc('/' + newDoc);
    const url = new URL(window.location);
    url.searchParams.set('doc', newDoc);
    history.replaceState(null, '', url);
  });

  function modelOptionFor(runtimeModel, models) {
    if (!Array.isArray(models) || !models.length) return runtimeModel || '';
    if (runtimeModel && models.includes(runtimeModel)) return runtimeModel;
    const friendly = aliasForSdk(runtimeModel);
    if (friendly && models.includes(friendly)) return friendly;
    return models[0];
  }

  function populateModels(models, currentRuntimeModel) {
    modelSelect.innerHTML = '';
    for (const alias of models) {
      const opt = document.createElement('option');
      opt.value = alias;
      // Label: "Haiku (fast)", "Sonnet (balanced)", "Opus (smart)"
      const tags = { haiku: 'fast', sonnet: 'balanced', opus: 'smart' };
      opt.textContent = alias.charAt(0).toUpperCase() + alias.slice(1) +
        (tags[alias] ? ' (' + tags[alias] + ')' : '');
      modelSelect.appendChild(opt);
    }
    currentModel = modelOptionFor(currentRuntimeModel, models);
    modelSelect.value = currentModel;
  }

  function aliasForSdk(sdkId) {
    if (!sdkId) return null;
    if (sdkId.includes('haiku'))  return 'haiku';
    if (sdkId.includes('sonnet')) return 'sonnet';
    if (sdkId.includes('opus'))   return 'opus';
    return null;
  }

  modelSelect.addEventListener('change', () => {
    const newModel = modelSelect.value;
    if (!newModel || newModel === currentModel) return;
    if (!confirm(`Switch to ${newModel}? This starts a fresh conversation.`)) {
      modelSelect.value = currentModel;
      return;
    }
    currentModel = newModel;
    if (ws && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify({ type: 'new_chat', model: newModel }));
    }
    log.innerHTML = '';
    currentAssistantMsg = null;
    hideActivity();
  });

  function handleMessage(data) {
    if (data.type === 'ready') {
      const urlDoc = new URLSearchParams(location.search).get('doc');
      currentDoc = urlDoc || data.doc;
      if (Array.isArray(data.docs)) populateDocs(data.docs);
      if (Array.isArray(data.models)) populateModels(data.models, data.model);
      loadDoc('/' + currentDoc);
      return;
    }
    if (data.type === 'docs') {
      // Doc list changed (e.g. after upload). Repopulate dropdown.
      // Also: a new doc just arrived — dismiss the + Doc overlay if it's
      // still up (drop may have landed off-overlay so the local handler
      // didn't hide it).
      if (newDocOverlay && !newDocOverlay.hidden) hideNewDocOverlay();
      if (Array.isArray(data.list)) populateDocs(data.list);
      // If server hints a doc to switch to (upload just landed), switch.
      if (data.doc && data.doc !== currentDoc) {
        currentDoc = data.doc;
        docSelect.value = data.doc;
        loadDoc('/' + data.doc);
        const url = new URL(window.location);
        url.searchParams.set('doc', data.doc);
        history.replaceState(null, '', url);
      }
      return;
    }
    if (data.type === 'model_changed') {
      // Backend confirmed switch; reflect in UI.
      const models = Array.from(modelSelect.options).map(opt => opt.value);
      const selected = modelOptionFor(data.model, models);
      if (selected && selected !== currentModel) {
        currentModel = selected;
        modelSelect.value = selected;
      }
      return;
    }
    if (data.type === 'doc_changed') {
      if (data.file === currentDoc) loadDoc('/' + data.file);
      return;
    }
    if (data.type === 'chat_reset') {
      log.innerHTML = '';
      currentAssistantMsg = null;
      hideActivity();
      return;
    }
    if (data.type === 'turn_done') {
      hideActivity();
      currentAssistantMsg = null;
      return;
    }
    if (data.type === 'error') {
      hideActivity();
      appendMessage('error', data.text);
      return;
    }
    if (data.role === 'user' && data.type === 'text') {
      appendMessage('user', data.text);
      return;
    }
    if (data.role === 'assistant') {
      if (data.type === 'text') { appendOrExtendAssistant(data.text); return; }
      if (data.type === 'tool_use') { updateActivityStatus(friendlyToolStatus(data)); return; }
    }
  }

  function basename(path) {
    if (!path) return '';
    const m = String(path).match(/[^\\/]+$/);
    return m ? m[0] : path;
  }
  function friendlyToolStatus(data) {
    const inp = data.input || {};
    const name = data.name || '';
    switch (name) {
      // Claude Agent SDK tool names
      case 'Read':      return 'Reading ' + (basename(inp.file_path) || 'a file') + '...';
      case 'Edit':      return 'Editing ' + (basename(inp.file_path) || 'a file') + '...';
      case 'Write':     return 'Writing ' + (basename(inp.file_path) || 'a file') + '...';
      case 'Glob':      return 'Searching for files matching ' + (inp.pattern || '...');
      case 'Grep':      return 'Searching content for "' + (inp.pattern || '...') + '"';
      case 'Bash':      return 'Running ' + ((inp.command || '').trim().split(/\s+/)[0] || 'a command') + '...';
      case 'WebFetch':  return 'Fetching ' + (inp.url || 'a URL') + '...';
      case 'WebSearch': return 'Searching the web...';
      // Codex CLI tool / call kinds (passed through from JSONL events)
      case 'apply_patch':
      case 'apply_patch_call':       return 'Patching files...';
      case 'shell':
      case 'local_shell':
      case 'local_shell_call':       return 'Running ' + ((inp.command || '').toString().trim().split(/\s+/)[0] || 'a shell command') + '...';
      case 'function_call':          return 'Calling ' + (inp.name || 'a function') + '...';
      case 'web_search':
      case 'web_search_call':        return 'Searching the web...';
      case 'tool_call':              return 'Calling tool ' + (inp.name || '') + '...';
      case 'reasoning':              return 'Thinking...';
      default:                        return 'Working with ' + name + '...';
    }
  }

  function renderChatMarkdown(target, rawText) {
    // Parse the assistant's text with the same markdown pipeline the doc uses,
    // including math protection so multi-line $$...$$ doesn't get split.
    try {
      const { text: protectedText, ph } = protectMath(rawText);
      let html = md.render(protectedText);
      html = restoreMath(html, ph);
      target.innerHTML = html;
      // Drop any <script> the assistant might have embedded — chat must not execute.
      target.querySelectorAll('script').forEach(s => s.remove());
    } catch (e) {
      target.textContent = rawText;
    }
    if (window.renderMathInElement) {
      try { window.renderMathInElement(target, {
        delimiters: [{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],
        throwOnError: false,
        ignoredTags: ['script','noscript','style','textarea','pre','code'],
      }); } catch(err) {}
    }
  }

  function appendMessage(role, text) {
    const div = document.createElement('div');
    div.className = 'msg ' + role;
    const r = document.createElement('div');
    r.className = 'msg-role';
    r.textContent = role;
    const t = document.createElement('div');
    t.className = 'msg-text';
    if (role === 'assistant') {
      t.dataset.raw = text || '';
      renderChatMarkdown(t, text || '');
    } else {
      t.textContent = text;
      if (window.renderMathInElement) {
        try { window.renderMathInElement(t, {
          delimiters: [{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],
          throwOnError: false,
        }); } catch(err) {}
      }
    }
    div.appendChild(r);
    div.appendChild(t);
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
    if (role === 'user') currentAssistantMsg = null;
    return div;
  }
  function appendOrExtendAssistant(text) {
    if (!currentAssistantMsg) {
      currentAssistantMsg = appendMessage('assistant', text);
    } else {
      const t = currentAssistantMsg.querySelector('.msg-text');
      t.dataset.raw = (t.dataset.raw || '') + text;
      renderChatMarkdown(t, t.dataset.raw);
    }
    log.scrollTop = log.scrollHeight;
  }
  function showActivity() {
    hideActivity();
    const div = document.createElement('div');
    div.className = 'activity';
    div.id = 'activity-indicator';
    const txt = document.createElement('span');
    txt.className = 'activity-text';
    txt.textContent = 'Working...';
    div.appendChild(txt);
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
  }
  function updateActivityStatus(text) {
    let el = document.getElementById('activity-indicator');
    if (!el) { showActivity(); el = document.getElementById('activity-indicator'); }
    const txt = el.querySelector('.activity-text');
    if (txt) txt.textContent = text;
    log.scrollTop = log.scrollHeight;
  }
  function hideActivity() {
    const el = document.getElementById('activity-indicator');
    if (el) el.remove();
  }

  sendBtn.addEventListener('click', () => {
    const text = input.value.trim();
    if (!text || sendBtn.disabled) return;
    const payload = { type: 'chat', text, model: currentModel };
    if (currentDoc || currentSelections.length > 0) {
      payload.context = {
        doc: currentDoc || null,
        selections: currentSelections.map(s => ({
          id: s.id,
          track_id: s.track_id,
          anchor_id: s.anchor_id,
          label: s.label,
          excerpt: s.excerpt,
        })),
      };
    }
    ws.send(JSON.stringify(payload));
    input.value = '';
    showActivity();
  });
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendBtn.click();
    }
  });
  newChatBtn.addEventListener('click', () => {
    if (!confirm('Start a fresh conversation? Document state preserved.')) return;
    if (ws && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify({ type: 'new_chat' }));
    }
    log.innerHTML = '';
    currentAssistantMsg = null;
    hideActivity();
  });
  function formatRelative(tsMs) {
    const diff = Date.now() - tsMs;
    const s = Math.floor(diff / 1000);
    if (s < 60) return s + 's ago';
    const m = Math.floor(s / 60);
    if (m < 60) return m + 'm ago';
    const h = Math.floor(m / 60);
    if (h < 24) return h + 'h ago';
    return Math.floor(h / 24) + 'd ago';
  }
  function formatBytes(n) {
    if (n < 1024) return n + ' B';
    if (n < 1024 * 1024) return (n / 1024).toFixed(1) + ' kB';
    return (n / 1024 / 1024).toFixed(2) + ' MB';
  }
  async function openHistoryPanel() {
    if (!currentDoc) return;
    historyPanel.innerHTML = '<div class="history-empty">loading…</div>';
    historyPanel.hidden = false;
    try {
      const resp = await fetch('/history?doc=' + encodeURIComponent(currentDoc));
      const data = await resp.json();
      const snaps = data.snapshots || [];
      if (!snaps.length) {
        historyPanel.innerHTML = '<div class="history-empty">No snapshots yet. They appear after the first agent edit.</div>';
        return;
      }
      historyPanel.innerHTML = '';
      for (const snap of snaps) {
        const btn = document.createElement('button');
        btn.className = 'history-row';
        btn.innerHTML = '<span class="history-row-ts"></span><span class="history-row-size"></span>';
        btn.querySelector('.history-row-ts').textContent =
          formatRelative(snap.ts_ms) + '  ·  ' + new Date(snap.ts_ms).toLocaleString();
        btn.querySelector('.history-row-size').textContent = formatBytes(snap.size);
        btn.addEventListener('click', async () => {
          if (!confirm('Restore `' + currentDoc + '` to this snapshot?\n' +
                       new Date(snap.ts_ms).toLocaleString() + '\n\n' +
                       'Current contents will be overwritten (but a fresh snapshot' +
                       ' of "before" will be saved on the next agent edit).')) return;
          historyPanel.hidden = true;
          initIframe();
          try {
            const r = await fetch(
              '/restore_snapshot?doc=' + encodeURIComponent(currentDoc) +
              '&snap_id=' + encodeURIComponent(snap.snap_id),
              { method: 'POST' }
            );
            if (!r.ok) {
              let msg = `restore failed: ${r.status}`;
              try { const j = await r.json(); if (j.error) msg = j.error; } catch (_) {}
              appendMessage('error', msg);
            }
          } catch (err) {
            appendMessage('error', 'restore error: ' + (err.message || err));
          }
        });
        historyPanel.appendChild(btn);
      }
    } catch (err) {
      historyPanel.innerHTML =
        '<div class="history-empty">failed to load history: ' +
        escapeHtml(err.message || String(err)) + '</div>';
    }
  }
  historyBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    if (historyPanel.hidden) { openHistoryPanel(); } else { historyPanel.hidden = true; }
  });
  const newDocChoose = document.getElementById('new-doc-choose');
  const newDocCard = newDocOverlay.querySelector('.new-doc-card');
  function showNewDocOverlay() { newDocOverlay.hidden = false; }
  function hideNewDocOverlay() {
    newDocOverlay.hidden = true;
    newDocOverlay.classList.remove('dropping');
  }
  newDocBtn.addEventListener('click', showNewDocOverlay);
  // Click anywhere on the drop area (overlay backdrop, not the buttons) opens
  // the file picker. Dismiss via Cancel / Esc / outside-the-doc-pane.
  newDocOverlay.addEventListener('click', (e) => {
    if (e.target === newDocChoose || e.target === newDocClose) return;
    if (newDocCard && newDocCard.contains(e.target) &&
        e.target !== newDocCard) return;  // clicks on hint text etc. don't picker
    newDocInput.click();
  });
  newDocChoose.addEventListener('click', (e) => {
    e.stopPropagation();
    newDocInput.click();
  });
  newDocClose.addEventListener('click', (e) => {
    e.stopPropagation();
    hideNewDocOverlay();
  });
  newDocOverlay.addEventListener('dragover', (e) => {
    e.preventDefault();
    if (e.dataTransfer) e.dataTransfer.dropEffect = 'copy';
    newDocOverlay.classList.add('dropping');
  });
  newDocOverlay.addEventListener('dragleave', (e) => {
    if (!newDocOverlay.contains(e.relatedTarget)) {
      newDocOverlay.classList.remove('dropping');
    }
  });
  newDocOverlay.addEventListener('drop', async (e) => {
    e.preventDefault();
    e.stopPropagation();
    newDocOverlay.classList.remove('dropping');
    const files = Array.from(e.dataTransfer && e.dataTransfer.files || []);
    if (!files.length) { hideNewDocOverlay(); return; }
    hideNewDocOverlay();
    await handleFrameDrop(files);
  });
  newDocInput.addEventListener('change', async () => {
    const file = newDocInput.files && newDocInput.files[0];
    newDocInput.value = '';  // allow re-picking the same file
    if (!file) return;
    hideNewDocOverlay();
    await handleFrameDrop([file]);
  });
  // Esc also closes the new-doc overlay (alongside the history panel).
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && !newDocOverlay.hidden) hideNewDocOverlay();
  });

  undoBtn.addEventListener('click', async () => {
    if (!currentDoc || undoBtn.disabled) return;
    undoBtn.disabled = true;
    initIframe();  // fresh iframe so any agent timers from the last edit die with the undo
    try {
      const resp = await fetch('/undo?doc=' + encodeURIComponent(currentDoc),
                               { method: 'POST' });
      if (!resp.ok) {
        let msg = `undo failed: ${resp.status}`;
        try { const j = await resp.json(); if (j.error) msg = j.error; } catch (_) {}
        appendMessage('error', msg);
      }
    } catch (err) {
      appendMessage('error', 'undo error: ' + (err.message || err));
    } finally {
      undoBtn.disabled = false;
    }
  });
  document.addEventListener('click', (e) => {
    if (!historyPanel.hidden && !historyPanel.contains(e.target) && e.target !== historyBtn) {
      historyPanel.hidden = true;
    }
    // Clicks outside the + Doc overlay (chrome, chat) dismiss it.
    if (newDocOverlay && !newDocOverlay.hidden &&
        !newDocOverlay.contains(e.target) && e.target !== newDocBtn) {
      hideNewDocOverlay();
    }
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && !historyPanel.hidden) {
      historyPanel.hidden = true;
    }
  });

  resetDocBtn.addEventListener('click', async () => {
    if (!currentDoc) return;
    if (!confirm('Reset `' + currentDoc + '` to history-0 (the earliest snapshot)?\n' +
                 'All edits since that snapshot will be discarded. ' +
                 'For the version shipped with this clone of the repo, ' +
                 'use `git checkout ' + currentDoc + '` from the command line instead.')) return;
    initIframe();  // fresh iframe so any agent timers/listeners die with the reset
    try {
      const resp = await fetch('/reset?doc=' + encodeURIComponent(currentDoc),
                               { method: 'POST' });
      if (!resp.ok) {
        let msg = `reset failed: ${resp.status}`;
        try { const j = await resp.json(); if (j.error) msg = j.error; } catch (e) {}
        appendMessage('error', msg);
        return;
      }
      // doc_changed broadcast will reload the viewer.
    } catch (err) {
      appendMessage('error', 'reset error: ' + (err.message || err));
    }
  });

  // ---- Drop-to-upload ------------------------------------------------------
  // Drop a .md and it loads directly. Drop a .tex/.txt/.rst/.org and the agent
  // is auto-prompted to convert it to adaptive markdown; the viewer switches
  // when the new file lands.
  const SUPPORTED_DROP_EXTS = ['.md', '.tex', '.txt', '.rst', '.org'];
  let dragDepth = 0;
  document.addEventListener('dragenter', (e) => {
    if (!e.dataTransfer || !Array.from(e.dataTransfer.types || []).includes('Files')) return;
    dragDepth++;
    document.body.classList.add('dropping');
  });
  document.addEventListener('dragover', (e) => {
    if (!e.dataTransfer || !Array.from(e.dataTransfer.types || []).includes('Files')) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = 'copy';
  });
  document.addEventListener('dragleave', (e) => {
    if (!e.dataTransfer || !Array.from(e.dataTransfer.types || []).includes('Files')) return;
    dragDepth--;
    if (dragDepth <= 0) {
      dragDepth = 0;
      document.body.classList.remove('dropping');
    }
  });
  document.addEventListener('drop', async (e) => {
    if (!e.dataTransfer) return;
    e.preventDefault();
    dragDepth = 0;
    document.body.classList.remove('dropping');
    const files = Array.from(e.dataTransfer.files || []);
    if (!files.length) return;
    await importFile(files[0]);
  });

  // ---- Resizable split pane ------------------------------------------------
  (function setupResizer() {
    const resizer = document.getElementById('resizer');
    const chatPane = document.getElementById('chat-pane');
    const saved = parseInt(localStorage.getItem('am-chat-width') || '', 10);
    if (saved && saved >= 280 && saved <= 1200) {
      chatPane.style.width = saved + 'px';
    }
    let dragging = false;
    resizer.addEventListener('mousedown', (e) => {
      dragging = true;
      resizer.classList.add('dragging');
      document.body.style.cursor = 'col-resize';
      document.body.style.userSelect = 'none';
      e.preventDefault();
    });
    document.addEventListener('mousemove', (e) => {
      if (!dragging) return;
      const w = window.innerWidth - e.clientX - 3;
      const clamped = Math.max(280, Math.min(window.innerWidth * 0.6, w));
      chatPane.style.width = clamped + 'px';
    });
    document.addEventListener('mouseup', () => {
      if (!dragging) return;
      dragging = false;
      resizer.classList.remove('dragging');
      document.body.style.cursor = '';
      document.body.style.userSelect = '';
      const w = parseInt(chatPane.style.width, 10);
      if (w) localStorage.setItem('am-chat-width', String(w));
    });
  })();

  renderViewTabs();
  initIframe();
  connect();
})();
</script>
</body>
</html>
