<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!--
  Adaptive-Markdown doc-iframe content host.

  This page is served at a DIFFERENT origin than the viewer chrome
  (in dev: http://localhost:<port>/iframe-host while the viewer is at
  http://127.0.0.1:<port>/). Both hostnames hit the same backend, but
  the browser's same-origin policy treats them as separate origins.

  The iframe is sandboxed with `allow-scripts allow-popups allow-same-origin`.
  The `allow-same-origin` is safe here precisely because "same-origin to
  itself" is a different origin from the parent — so the iframe can hold
  its own cookies / Cache Storage / localStorage (needed for nested
  third-party embeds like YouTube), but its scripts still cannot reach
  parent.document, parent.localStorage, etc.

  Parent ↔ iframe communicate via postMessage only. Origin checks at
  both ends prevent unrelated tabs from speaking the protocol.
-->
<base id="doc-base">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<style>
/* Baseline CSS custom properties. Override on :root in your doc-local
   <style> block to re-theme the whole page without redefining every rule. */
:root {
  --am-bg: #ffffff;
  --am-surface: #ffffff;
  --am-text: #18181b;
  --am-muted: #71717a;
  --am-link: #4f46e5;
  --am-code-bg: #f4f4f5;
  --am-pre-bg: #f4f4f5;
  --am-blockquote-border: #e4e4e7;
  --am-blockquote-text: #52525b;
  --am-theorem-color: #4f46e5;
  --am-definition-color: #d97706;
  --am-example-color: #16a34a;
  --am-figure-placeholder-border: #e4e4e7;
  --am-figure-caption: #71717a;
  --am-note-bg: #f4f4f5;
  --am-note-border: #a1a1aa;
  --am-pinned-bg: #fef3c7;
  --am-pinned-border: #d97706;
  --am-error-bg: #fef2f2;
  --am-error-border: #fecaca;
  --am-error-text: #991b1b;
  --am-selection-outline: #4f46e5;
  --am-hover-outline: #d4d4d8;
  --am-widget-bg: #ffffff;
}

:root[data-theme="dark"] {
  --am-bg: #0b0b10;
  --am-surface: #15151c;
  --am-text: #e8e8ed;
  --am-muted: #8b8b95;
  --am-link: #818cf8;
  --am-code-bg: #1c1c24;
  --am-pre-bg: #1c1c24;
  --am-blockquote-border: #2a2a32;
  --am-blockquote-text: #a1a1aa;
  --am-theorem-color: #818cf8;
  --am-definition-color: #fbbf24;
  --am-example-color: #4ade80;
  --am-figure-placeholder-border: #2a2a32;
  --am-figure-caption: #8b8b95;
  --am-note-bg: rgba(255, 255, 255, 0.04);
  --am-note-border: #52525b;
  --am-pinned-bg: rgba(251, 191, 36, 0.08);
  --am-pinned-border: #fbbf24;
  --am-error-bg: rgba(248, 113, 113, 0.09);
  --am-error-border: rgba(248, 113, 113, 0.3);
  --am-error-text: #fca5a5;
  --am-selection-outline: #818cf8;
  --am-hover-outline: #3a3a44;
  /* Live-renderer canvases (music notation SVG, data grid, Mermaid SVG)
     need a light backdrop in dark mode — they're authored against white
     and reversing them looks bad. Keep canvases white in dark theme. */
  --am-widget-bg: #ffffff;
}

html, body { margin: 0; padding: 0; min-height: 100%; box-sizing: border-box; }
body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif; font-size: 17px; line-height: 1.6; color: var(--am-text); background: var(--am-bg); padding: 32px 56px; }
.meta { color: var(--am-muted); font-size: 13px; margin: 0 auto 24px; max-width: 760px; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
article#body { max-width: 760px; margin: 0 auto; }
article#body h1 { font-size: 1.8rem; margin: 0 0 1rem; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
article#body h2 { font-size: 1.3rem; margin: 1.8em 0 0.5em; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
article#body h3 { font-size: 1.1rem; margin: 1.4em 0 0.4em; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
article#body p { margin: 1em 0; }
article#body blockquote { margin: 1em 0; padding: 0.6em 1em; border-left: 3px solid var(--am-blockquote-border); color: var(--am-blockquote-text); }
article#body code { background: var(--am-code-bg); padding: 0.1em 0.4em; border-radius: 3px; font-size: 0.92em; }
article#body pre { background: var(--am-pre-bg); padding: 0.8em; border-radius: 3px; overflow-x: auto; }
article#body pre code { background: transparent; padding: 0; }
article#body a { color: var(--am-link); }
article#body :is(h1,h2,h3,h4,h5,h6,p,blockquote,ul,ol,pre,table,article,section,aside,details,figure,div.pinned,div.narrative) { cursor: pointer; }
article#body .hover-block { outline: 1px dashed var(--am-hover-outline); outline-offset: 6px; }
article#body .selected-block, article#body .selected-block.hover-block { outline: 2px solid var(--am-selection-outline); outline-offset: 6px; border-radius: 2px; }
article#body .insertion-marker { height: 2px; background: var(--am-selection-outline); margin: 6px 0; border-radius: 1px; pointer-events: none; opacity: 0.85; }
article#body [data-kind="theorem"], article#body [data-kind="lemma"], article#body [data-kind="proposition"], article#body [data-kind="corollary"] { color: var(--am-theorem-color); font-style: italic; }
article#body [data-kind="definition"] { color: var(--am-definition-color); font-style: italic; }
article#body [data-kind="example"], article#body [data-kind="solution"], article#body [data-kind="proof"] { color: var(--am-example-color); font-style: italic; }
article#body section.theorem, article#body section.lemma, article#body section.proposition, article#body section.corollary { border-left: 3px solid var(--am-theorem-color); padding: 0.4em 0.9em; margin: 1em 0; }
article#body section.definition { border-left: 3px solid var(--am-definition-color); padding: 0.4em 0.9em; margin: 1em 0; }
article#body section.example, article#body section.solution, article#body section.proof { border-left: 3px solid var(--am-example-color); padding: 0.4em 0.9em; margin: 1em 0; }
aside.note, aside.aside, aside.remark, .note, .aside, .remark { border-left: 3px solid var(--am-note-border); background: var(--am-note-bg); padding: 0.8em 1.2em; margin: 1em 0; }
.pinned { border-left: 3px solid var(--am-pinned-border); background: var(--am-pinned-bg); padding: 0.8em 1.2em; margin: 1em 0; }
/* Per-doc agent skill: meta material authored for the agent's use, not for
   the reader. Author writes it as a normal HTML block in the doc body
   (so it ships with the file, survives Reset / export); the rendered Doc
   view hides it. Source view shows it as-is, so the author can read and
   edit it; the agent reads it via the chat preamble (which inlines the
   raw source). */
.agent-skill { display: none; }
figure { padding: 0.6em; margin: 1em 0; text-align: center; border-radius: 4px; }
figure:not(:has(canvas, svg, img, video, audio, iframe, .desmos-container, picture, table)) { border: 1px dashed var(--am-figure-placeholder-border); }
figure figcaption { font-style: italic; color: var(--am-figure-caption); padding-top: 0.35em; }
.error-banner { background: var(--am-error-bg); border: 1px solid var(--am-error-border); border-radius: 4px; padding: 0.75rem 1rem; color: var(--am-error-text); font-family: ui-monospace, monospace; font-size: 0.85rem; white-space: pre-wrap; }
/* Music figures: the renderer replaces the inner source with notation +
   audio. We don't want the figure's dashed-placeholder border showing
   through, and we want a bit of breathing room above the audio widget. */
figure.music { text-align: left; border: 0; padding: 0.4em 0; }
figure.music .abc-notation, figure.music .musicxml-render { background: var(--am-widget-bg); padding: 0.5em; border-radius: 4px; overflow-x: auto; }
figure.music .abc-audio { margin-top: 0.6em; }
figure.music midi-player { display: block; margin: 0.4em 0; }
/* Data figures: same logic as music — hide the dashed placeholder
   since the renderer fills the figure, and give the live grid a
   reasonable size. Tabulator brings its own CSS but we cap height. */
figure.data { text-align: left; border: 0; padding: 0.4em 0; }
figure.data .data-grid { background: var(--am-widget-bg); border-radius: 4px; overflow: hidden; max-height: 60vh; }
figure.data script[type="text/csv"],
figure.data script[type="application/json"] { display: none; }
/* Diagram figures: Mermaid renders SVG into the sibling div. White
   background + padding keeps the diagram readable across themes;
   max-width caps width on portrait viewports while preserving aspect. */
figure.diagram { text-align: left; border: 0; padding: 0.4em 0; }
figure.diagram .mermaid-render { background: var(--am-widget-bg); padding: 0.5em; border-radius: 4px; overflow-x: auto; text-align: center; }
figure.diagram .mermaid-render svg { max-width: 100%; height: auto; }
figure.diagram script[type="text/x-mermaid"] { display: none; }
/* Plot figures: Plotly.js renders into a sibling div. Same widget-bg
   policy as music/data/diagrams — the canvas stays light in dark
   mode because Plotly's default theme is authored against white. */
figure.plot { text-align: left; border: 0; padding: 0.4em 0; }
figure.plot .plot-render { background: var(--am-widget-bg); padding: 0.25em; border-radius: 4px; min-height: 320px; overflow: hidden; }
figure.plot script[type="application/json"] { display: none; }
/* Vega / Vega-Lite figures: vega-embed renders into a sibling div.
   Distinct from figure.plot because the spec shape is different
   (Vega-Lite uses {mark, encoding, data}, Plotly uses {data, layout});
   the agent picks the figure class to pick the library. Same widget-bg
   policy — Vega's default theme assumes light. */
figure.vega { text-align: left; border: 0; padding: 0.4em 0; }
figure.vega .vega-render { background: var(--am-widget-bg); padding: 0.4em; border-radius: 4px; min-height: 240px; overflow-x: auto; text-align: center; }
figure.vega .vega-render canvas, figure.vega .vega-render svg { max-width: 100%; height: auto; }
figure.vega script[type="application/json"] { display: none; }

/* Print: let content flow across pages naturally. The viewport-sized
   default body padding is fine, but interactive UI affordances (hover
   outlines, selection rings, click cursors) shouldn't print, and
   structural blocks should avoid mid-page splits where possible. */
@media print {
  body { padding: 24px 36px; font-size: 12pt; line-height: 1.45; }
  article#body { max-width: none; }
  article#body :is(h1,h2,h3,h4,h5,h6,p,blockquote,ul,ol,article,section,aside,figure,div.pinned) { cursor: auto; }
  article#body .hover-block,
  article#body .selected-block,
  article#body .selected-block.hover-block { outline: 0 !important; }
  article#body .insertion-marker { display: none; }
  h1, h2, h3, h4 { page-break-after: avoid; break-after: avoid; }
  figure, table, pre, blockquote { page-break-inside: avoid; break-inside: avoid; }
  section.theorem, section.lemma, section.proposition, section.corollary,
  section.definition, section.example, section.solution, section.proof {
    page-break-inside: avoid; break-inside: avoid;
  }
  /* Live-renderer iframes (YouTube, etc.) and audio widgets won't
     print meaningfully — let them be omitted rather than leaving
     blank rectangles. */
  audio, video, iframe[src*="youtube"], iframe[src*="vimeo"],
  midi-player, .abc-audio { display: none !important; }
}
</style>
</head>
<body>
<div class="meta" id="meta"></div>
<article id="body"></article>

<script src="https://cdn.jsdelivr.net/npm/morphdom@2.7.4/dist/morphdom-umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/turndown@7.1.2/dist/turndown.js"></script>

<script>
(function(){
  'use strict';

  // Origin of the parent that's allowed to drive this iframe. The parent
  // injects its origin via a one-shot `hello` message at boot; subsequent
  // messages from any other origin are ignored. Until hello arrives we
  // accept only the `hello` itself.
  let PARENT_ORIGIN = null;

  const body = document.getElementById('body');
  const meta = document.getElementById('meta');

  // ---- Per-script cleanup tracking ---------------------------------------
  // window.__doc.cleanup(fn) attaches a teardown to the currently-executing
  // <script>. When that script is later removed/replaced (agent edit), its
  // cleanups run. Scripts that survive the edit (textContent unchanged)
  // keep their resources intact — timers, listeners, canvas animations.
  const SCRIPT_CLEANUPS = new WeakMap();
  let _currentScript = null;

  // Per-figure stash of the active renderer instance. Populated by
  // renderMusicBlocks after a successful render; read by widgets via
  // window.__doc.getRenderer(figureEl). Lets a widget mutate the score
  // via the library's own API (e.g. OSMD's `Sheet.Transpose`) instead
  // of rewriting source and forcing a full reload — which is fragile
  // because XML/JSON/etc. serializers don't round-trip byte-stably.
  // WeakMap so the entry is GC'd when the figure leaves the DOM.
  const FIGURE_RENDERERS = new WeakMap();

  // Claim/release registry for window.__doc.guard. Set-of-strings; an
  // entry exists while a script holds the guard. Released automatically
  // by the cleanup the guard call registered. The Set survives across
  // setContent (it lives on the iframe's window, not in body DOM); a
  // full iframe reload (which we trigger for JS edits) wipes it.
  const _DOC_GUARDS = new Set();

  window.__doc = {
    cleanup(fn) {
      if (typeof fn !== 'function') return;
      if (_currentScript) {
        const a = SCRIPT_CLEANUPS.get(_currentScript);
        if (a) a.push(fn);
      }
    },
    // Idempotent claim. Returns true the first time it's called with a
    // given name in this iframe's lifetime; false on subsequent calls
    // (the guard is held). The first claimant automatically registers
    // a cleanup that releases the guard when the script is removed,
    // so re-execution after edit is safe.
    //
    // Replaces the ad-hoc `if (window.__sentinel) return;` pattern
    // which never released its sentinel and silently no-op'd on
    // re-exec. Use this for scripts that need to be guarded against
    // re-execution within the same iframe session (rare, given that
    // JS edits trigger a full iframe reload — but the API exists for
    // defense in depth).
    guard(name) {
      if (typeof name !== 'string' || !name) return true;
      if (_DOC_GUARDS.has(name)) return false;
      _DOC_GUARDS.add(name);
      if (_currentScript) {
        const a = SCRIPT_CLEANUPS.get(_currentScript);
        if (a) a.push(() => _DOC_GUARDS.delete(name));
      }
      return true;
    },
    // Re-run the figure renderers (and KaTeX) over `el`. Use this from
    // an in-doc widget that mutated a figure's source — change the
    // <script class="music-musicxml-source"> body to a transposed XML,
    // rewrite a .abc div's text, swap a math span's source — then call
    // window.__doc.rerender(figureEl) to make the rendered output
    // catch up. The renderer remains the single owner of how each
    // figure type becomes a visual; widgets don't have to know which
    // library (OSMD / abcjs / KaTeX) is in play.
    //
    // We deliberately clear the per-element "already rendered" markers
    // so this is a *force* re-render: if a caller bothered to invoke
    // it, they want the rerender. Without this, renderMusicBlocks's
    // dataset.amMusicSource comparison would skip elements whose old
    // textContent happened to match (or whose markers got copied).
    async rerender(el) {
      if (!el || el.nodeType !== 1) return;
      el.querySelectorAll(
        'figure.music .abc, ' +
        'figure.music script[type="application/vnd.recordare.musicxml+xml"], ' +
        'figure.music midi-player'
      ).forEach(n => {
        delete n.dataset.amMusicSource;
        delete n.dataset.amMusicLoaded;
      });
      el.querySelectorAll(
        'figure.data script[type="text/csv"], '
        + 'figure.data script[type="application/json"]'
      ).forEach(n => {
        delete n.dataset.amDataSource;
      });
      // Generic-renderer figure types (plot / vega / diagram): clear
      // their dataset markers + re-run via the dispatch loop below.
      for (const [cls, cfg] of FIGURE_TYPES) {
        el.querySelectorAll(
          `figure.${cls} script[type="${cfg.scriptType}"]`
        ).forEach(n => { delete n.dataset[cfg.markerKey]; });
      }
      try { await renderMusicBlocks(el); }
      catch (e) { console.warn('__doc.rerender music:', e); }
      try { await renderDataBlocks(el); }
      catch (e) { console.warn('__doc.rerender data:', e); }
      for (const cls of FIGURE_TYPES.keys()) {
        try { await renderFigureType(el, cls); }
        catch (e) { console.warn(`__doc.rerender ${cls}:`, e); }
      }
      try { renderMath(el); }
      catch (e) { console.warn('__doc.rerender math:', e); }
    },
    // Return the live renderer for a figure, or null if none is in
    // play. Use this when you want to mutate the visual *without*
    // rewriting source — e.g. transpose via `osmd.Sheet.Transpose`,
    // change tempo, swap a colour map. The returned shape is:
    //
    //   { kind, instance, source }
    //
    // where `kind` is `'musicxml'` (instance = OSMD), `'abc'` (instance
    // = abcjs visualObj), or a future renderer's tag. `source` is the
    // string that was loaded into the instance — useful if you want to
    // know what's in there without re-reading the script tag.
    //
    // For full rebuilds (you changed the source string and want the
    // renderer to consume the new value), call `__doc.rerender(el)`
    // instead. getRenderer is for *incremental* mutation, rerender is
    // for *fresh* render.
    getRenderer(el) {
      const figure = el && el.closest ? el.closest('figure') : null;
      if (!figure) return null;
      return FIGURE_RENDERERS.get(figure) || null;
    }
  };
  function runScriptCleanups(s) {
    const a = SCRIPT_CLEANUPS.get(s);
    if (!a) return;
    for (const fn of a) { try { fn(); } catch (_) {} }
    SCRIPT_CLEANUPS.delete(s);
  }

  // ---- Block identity / annotation ---------------------------------------
  const TRACK_ID_RE = /^\s*id\s*:\s*(b-[A-Z0-9-]+)\s*$/i;
  const KIND = new Set([
    'theorem','lemma','proposition','corollary',
    'definition','example','remark','note','aside','proof','solution'
  ]);

  function attachIds(container) {
    const w = document.createTreeWalker(container, NodeFilter.SHOW_COMMENT);
    const cs = [];
    let n;
    while ((n = w.nextNode())) cs.push(n);
    for (const k of cs) {
      const m = k.textContent.match(TRACK_ID_RE);
      if (!m) continue;
      let s = k.nextSibling;
      while (s && s.nodeType !== 1) s = s.nextSibling;
      if (s) s.dataset.trackId = m[1];
    }
  }
  function annotateHs(root) {
    root.querySelectorAll('h1,h2,h3,h4,h5,h6').forEach(h => {
      const f = (h.textContent.trim().match(/^(\w+)/) || [])[1];
      if (f && KIND.has(f.toLowerCase())) h.dataset.kind = f.toLowerCase();
    });
  }

  // Convert an innerHTML-parsed <script> into a fresh element so the browser
  // actually executes it. Sets _currentScript across the synchronous
  // execution so __doc.cleanup attaches to this script.
  function reExec(s) {
    const ns = document.createElement('script');
    for (const a of Array.from(s.attributes)) ns.setAttribute(a.name, a.value);
    ns.textContent = s.textContent;
    SCRIPT_CLEANUPS.set(ns, []);
    _currentScript = ns;
    s.parentNode.replaceChild(ns, s);
    _currentScript = null;
    return ns;
  }
  function scriptKey(s) { return (s.src || '') + '#' + s.textContent; }

  // Wrap each `$...$` / `$$...$$` math source in a span carrying the
  // original markdown delimiters as `data-source`. KaTeX still renders
  // inside the wrapper (auto-render walks text nodes, doesn't care about
  // the surrounding span); the wrapper's data-source attribute survives,
  // and turndown's custom rule (see getTurndown) reads it back out so
  // inline-edit round-trip preserves math instead of clobbering it with
  // raw `<span class="katex">...` markup.
  function protectMathSource(root) {
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
      acceptNode(node) {
        let p = node.parentElement;
        while (p) {
          const tag = p.tagName;
          if (tag === 'SCRIPT' || tag === 'STYLE' || tag === 'PRE'
              || tag === 'CODE' || tag === 'TEXTAREA' || tag === 'NOSCRIPT') {
            return NodeFilter.FILTER_REJECT;
          }
          if (p.classList && p.classList.contains('am-math-keep')) {
            return NodeFilter.FILTER_REJECT;
          }
          p = p.parentElement;
        }
        return NodeFilter.FILTER_ACCEPT;
      },
    });
    const nodes = [];
    let n;
    while ((n = walker.nextNode())) nodes.push(n);
    const RE = /\$\$([\s\S]+?)\$\$|\$([^$\n]+?)\$/g;
    for (const node of nodes) {
      const text = node.nodeValue;
      if (!text || text.indexOf('$') === -1) continue;
      RE.lastIndex = 0;
      let lastIdx = 0;
      const out = [];
      let m;
      while ((m = RE.exec(text)) !== null) {
        const before = text.slice(lastIdx, m.index);
        if (before) out.push(document.createTextNode(before));
        const isDisplay = m[1] !== undefined;
        const inner = isDisplay ? m[1] : m[2];
        const source = isDisplay ? ('$$' + inner + '$$') : ('$' + inner + '$');
        const span = document.createElement('span');
        span.className = 'am-math-keep';
        span.setAttribute('data-source', source);
        if (isDisplay) span.setAttribute('data-display', '1');
        span.appendChild(document.createTextNode(source));
        out.push(span);
        lastIdx = m.index + m[0].length;
      }
      if (out.length === 0) continue;
      const remainder = text.slice(lastIdx);
      if (remainder) out.push(document.createTextNode(remainder));
      const parent = node.parentNode;
      for (const o of out) parent.insertBefore(o, node);
      parent.removeChild(node);
    }
  }

  // ---- Music rendering -----------------------------------------------
  // Convention: `<figure class="music">` containing one of
  //   - `<div class="abc">…ABC notation…</div>`
  //   - `<div class="musicxml">…XML…</div>`
  //   - `<midi-player src="assets/song.mid" sound-font>`
  // Each renderer lazy-loads its CDN library only when the doc actually
  // contains music — empty cost for docs that don't use it.
  //
  // morphdom would normally replace our rendered notation with the
  // markdown source on every setContent. We mark rendered divs with
  // `data-am-music-source` (the source text we rendered from) and the
  // morphdom onBeforeElUpdated check below uses it to skip morph when
  // the source hasn't changed.

  const _scriptLoadPromises = new Map();
  function loadScriptOnce(src) {
    if (_scriptLoadPromises.has(src)) return _scriptLoadPromises.get(src);
    const p = new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = src;
      s.async = true;
      s.onload = () => resolve();
      s.onerror = () => reject(new Error('failed to load ' + src));
      document.head.appendChild(s);
    });
    _scriptLoadPromises.set(src, p);
    return p;
  }

  const _styleLoadPromises = new Map();
  function loadStylesheetOnce(href) {
    if (_styleLoadPromises.has(href)) return _styleLoadPromises.get(href);
    const p = new Promise((resolve, reject) => {
      const link = document.createElement('link');
      link.rel = 'stylesheet';
      link.href = href;
      link.onload = () => resolve();
      link.onerror = () => reject(new Error('failed to load ' + href));
      document.head.appendChild(link);
    });
    _styleLoadPromises.set(href, p);
    return p;
  }

  async function renderMusicBlocks(root) {
    // --- ABC ---
    const abcDivs = Array.from(root.querySelectorAll('figure.music div.abc'));
    const abcTodo = abcDivs.filter(d =>
      d.dataset.amMusicSource !== (d.textContent || '').trim()
    );
    if (abcTodo.length) {
      try {
        // abcjs ships its audio-widget CSS separately; without it the
        // play widget renders as "CSS required: load abcjs-audio.css".
        loadStylesheetOnce(
          'https://cdn.jsdelivr.net/npm/abcjs@6/abcjs-audio.css',
        ).catch(() => {});
        await loadScriptOnce(
          'https://cdn.jsdelivr.net/npm/abcjs@6/dist/abcjs-basic-min.min.js',
        );
        for (const div of abcTodo) {
          const source = (div.textContent || '').trim();
          div.dataset.amMusicSource = source;
          div.innerHTML = '';
          const notation = document.createElement('div');
          notation.className = 'abc-notation';
          div.appendChild(notation);
          try {
            const visual = window.ABCJS.renderAbc(notation, source, {
              responsive: 'resize',
            });
            const fig = div.closest('figure');
            if (fig) FIGURE_RENDERERS.set(fig, {
              kind: 'abc', instance: visual && visual[0], source,
            });
            if (window.ABCJS.synth && window.ABCJS.synth.supportsAudio()) {
              const audio = document.createElement('div');
              audio.className = 'abc-audio';
              div.appendChild(audio);
              const synth = new window.ABCJS.synth.SynthController();
              synth.load(audio, null, {
                displayLoop: false, displayRestart: true,
                displayPlay: true, displayProgress: true, displayWarp: true,
              });
              const midiBuffer = new window.ABCJS.synth.CreateSynth();
              midiBuffer.init({ visualObj: visual[0] })
                .then(() => synth.setTune(visual[0], false))
                .catch(err => console.warn('abc audio init:', err));
            }
          } catch (e) {
            notation.innerHTML =
              '<div class="error-banner">ABC render failed: '
              + (e.message || e) + '</div>';
          }
        }
      } catch (e) {
        console.warn('abcjs failed to load:', e);
      }
    }

    // --- MusicXML ---
    // The XML lives inside a `<script type="application/vnd.recordare
    // .musicxml+xml">…<\/script>` so the browser doesn't HTML-parse the
    // `<score-partwise>` and friends. We read textContent from the
    // script (returns the source verbatim) and render into a sibling
    // div.musicxml-render so we don't try to mutate the script's body.
    const xmlScripts = Array.from(root.querySelectorAll(
      'figure.music script[type="application/vnd.recordare.musicxml+xml"]'
    ));
    // Same am:keep strip as data/diagram renderers — preserveStructuralBlocks
    // injects sentinels in place of blank lines inside any <script>, and
    // OSMD's XML parser would barf on the sentinel text in a real-world
    // MusicXML doc that happens to have blank lines for readability.
    const xmlNormalize = (s) => (s || '').replace(/<!--am:keep-->/g, '').trim();
    const xmlTodo = xmlScripts.filter(s =>
      s.dataset.amMusicSource !== xmlNormalize(s.textContent)
    );
    if (xmlTodo.length) {
      try {
        await loadScriptOnce(
          'https://cdn.jsdelivr.net/npm/opensheetmusicdisplay@1.9.0/build/opensheetmusicdisplay.min.js',
        );
        for (const script of xmlTodo) {
          const source = xmlNormalize(script.textContent);
          script.dataset.amMusicSource = source;
          // Reuse an existing sibling render target if morphdom left one;
          // otherwise create one immediately after the script node.
          let target = script.nextElementSibling;
          if (!target || !target.classList.contains('musicxml-render')) {
            target = document.createElement('div');
            target.className = 'musicxml-render';
            script.parentNode.insertBefore(target, script.nextSibling);
          } else {
            target.innerHTML = '';
          }
          try {
            const osmd = new window.opensheetmusicdisplay.OpenSheetMusicDisplay(target);
            await osmd.load(source);
            osmd.render();
            const fig = script.closest('figure');
            if (fig) FIGURE_RENDERERS.set(fig, {
              kind: 'musicxml', instance: osmd, source,
            });
          } catch (e) {
            target.innerHTML =
              '<div class="error-banner">MusicXML render failed: '
              + (e.message || e) + '</div>';
          }
        }
      } catch (e) {
        console.warn('OpenSheetMusicDisplay failed to load:', e);
      }
    }

    // --- MIDI (web component upgrades automatically once the script loads) ---
    const midiTags = root.querySelectorAll(
      'figure.music midi-player:not([data-am-music-loaded])',
    );
    if (midiTags.length) {
      try {
        await loadScriptOnce(
          'https://cdn.jsdelivr.net/npm/html-midi-player@1.5.0',
        );
        midiTags.forEach(el => { el.dataset.amMusicLoaded = '1'; });
      } catch (e) {
        console.warn('html-midi-player failed to load:', e);
      }
    }
  }

  // RFC-4180-ish CSV parser. Handles quoted fields, escaped quotes
  // ("""" → `"`), embedded commas, embedded newlines inside quoted
  // fields, CRLF or LF line endings. Returns an array of arrays. Not
  // a complete RFC implementation (no encoding sniffing, no UTF-16
  // BOM detection — backend strips those before we ever see the text)
  // but covers the 99% case for spreadsheet-exported CSVs.
  function parseCSV(text) {
    const rows = [];
    let row = [];
    let field = '';
    let inQuotes = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (inQuotes) {
        if (c === '"') {
          if (text[i + 1] === '"') { field += '"'; i++; }
          else { inQuotes = false; }
        } else {
          field += c;
        }
      } else {
        if (c === '"' && field === '') { inQuotes = true; }
        else if (c === ',') { row.push(field); field = ''; }
        else if (c === '\n' || c === '\r') {
          row.push(field);
          rows.push(row);
          row = [];
          field = '';
          if (c === '\r' && text[i + 1] === '\n') i++;
        } else {
          field += c;
        }
      }
    }
    if (field !== '' || row.length) {
      row.push(field);
      rows.push(row);
    }
    return rows;
  }

  async function renderDataBlocks(root) {
    // Source lives in <figure class="data"><script type="text/csv">…
    // <\/script> for CSV, OR <script type="application/json">…<\/script>
    // for JSON (array-of-records or array-of-arrays-with-header-row).
    // The script-with-non-JS-type trick (same as MusicXML) makes the
    // browser treat the body as opaque data — textContent returns the
    // source verbatim. Both feed the same Tabulator instance under a
    // sibling .data-grid div, so the agent's mutation patterns
    // (script.textContent edit + __doc.rerender, or
    // table.replaceData() via getRenderer().instance) are uniform.
    // (The `<\/script>` above is escaped: a literal end-script token
    // inside ANY script-tag content, even in a JS comment, terminates
    // the parent script tag at HTML-parser level. Same fix we made
    // in renderMusicBlocks a few commits back.)
    const csvScripts = Array.from(root.querySelectorAll(
      'figure.data script[type="text/csv"], '
      + 'figure.data script[type="application/json"]'
    ));
    // preserveStructuralBlocks injects <!--am:keep--> in place of blank
    // lines (to keep CommonMark's type-6 HTML block intact). Strip them
    // here so the CSV parser sees the original blank rows. Without this
    // strip, the marker comparison would also mismatch every re-render.
    const normalize = (s) => (s || '').replace(/<!--am:keep-->/g, '').trim();
    const todo = csvScripts.filter(s =>
      s.dataset.amDataSource !== normalize(s.textContent)
    );
    if (!todo.length) return;

    try {
      await Promise.all([
        loadStylesheetOnce(
          'https://cdn.jsdelivr.net/npm/tabulator-tables@5.5.4/dist/css/tabulator.min.css',
        ),
        loadScriptOnce(
          'https://cdn.jsdelivr.net/npm/tabulator-tables@5.5.4/dist/js/tabulator.min.js',
        ),
      ]);
    } catch (e) {
      console.warn('tabulator failed to load:', e);
      return;
    }

    for (const script of todo) {
      const source = normalize(script.textContent);
      script.dataset.amDataSource = source;
      // Reuse a sibling render target if morphdom left one (preserved
      // via onBeforeNodeDiscarded); otherwise create one.
      let target = script.nextElementSibling;
      if (!target || !target.classList.contains('data-grid')) {
        target = document.createElement('div');
        target.className = 'data-grid';
        script.parentNode.insertBefore(target, script.nextSibling);
      } else {
        target.innerHTML = '';
      }
      const isJson = script.type === 'application/json';
      try {
        let headers, data;
        if (isJson) {
          // Two accepted shapes:
          //   - Array of records: [{a:1, b:2}, {a:3, b:4}]
          //     Columns = union of all keys, in first-seen order.
          //   - Array of arrays with header row: [["a","b"], [1,2], [3,4]]
          //     First row treated as headers (consistent with CSV).
          const parsed = JSON.parse(source);
          if (!Array.isArray(parsed)) {
            target.innerHTML =
              '<div class="error-banner">JSON data must be an array.</div>';
            continue;
          }
          if (parsed.length === 0) {
            target.innerHTML =
              '<div class="error-banner">JSON array is empty.</div>';
            continue;
          }
          if (Array.isArray(parsed[0])) {
            headers = parsed[0].map((h, i) => String(h || `col${i + 1}`));
            data = parsed.slice(1).map(r => {
              const obj = {};
              for (let i = 0; i < headers.length; i++) {
                obj[headers[i]] = r[i] !== undefined ? r[i] : '';
              }
              return obj;
            });
          } else {
            const seen = new Set();
            headers = [];
            for (const row of parsed) {
              if (row && typeof row === 'object') {
                for (const k of Object.keys(row)) {
                  if (!seen.has(k)) { seen.add(k); headers.push(k); }
                }
              }
            }
            data = parsed;
          }
        } else {
          // CSV path
          const rows = parseCSV(source);
          if (rows.length < 1) {
            target.innerHTML =
              '<div class="error-banner">CSV is empty.</div>';
            continue;
          }
          // First row = headers. Subsequent rows = data rows mapped to
          // header keys. Tabulator wants `[{col1: v1, col2: v2}, ...]`
          // with a parallel `columns` config naming each field.
          headers = rows[0].map((h, i) => h || `col${i + 1}`);
          data = rows.slice(1).map(r => {
            const obj = {};
            for (let i = 0; i < headers.length; i++) {
              obj[headers[i]] = r[i] !== undefined ? r[i] : '';
            }
            return obj;
          });
        }
        const columns = headers.map(h => ({
          title: h, field: h,
          // Headers get sort + a width hint so very-long fields don't
          // explode the grid. Tabulator's `headerSort` defaults true.
          headerFilter: 'input',
        }));
        const table = new window.Tabulator(target, {
          data, columns,
          layout: 'fitDataStretch',
          // Treat field names as literal property keys, never nested
          // accessors. Tabulator's default is to split on `.` so e.g.
          // `field: "Sepal.Length"` would resolve as `row.Sepal.Length`
          // and return undefined. Standard R-exported CSVs (iris,
          // mtcars, etc.) use dotted column names, and so do plenty of
          // hand-built JSON datasets with namespaced keys. Disabling
          // the separator entirely makes any flat dataset Just Work.
          nestedFieldSeparator: false,
          // Reasonable defaults; the agent can mutate via
          // __doc.getRenderer(fig).instance.setColumns(...) etc.
          pagination: data.length > 100 ? 'local' : false,
          paginationSize: 50,
          height: data.length > 50 ? '60vh' : undefined,
        });
        const fig = script.closest('figure');
        if (fig) FIGURE_RENDERERS.set(fig, {
          kind: isJson ? 'json' : 'csv', instance: table, source,
        });
      } catch (e) {
        target.innerHTML =
          '<div class="error-banner">data-table render failed: '
          + (e.message || e) + '</div>';
      }
    }
  }

  // Monotonic id for Mermaid render calls — Mermaid uses the id for
  // internal SVG element ids, so collisions across re-renders cause
  // the lib to throw "id already exists in DOM". Bumping per call.
  let _mermaidCounter = 0;

  // ---- Generic figure renderer (dispatch table) ---------------------------
  // The three "one library, one script type, one render target" figure
  // types — plot (Plotly), vega (Vega-Lite), diagram (Mermaid) — share
  // ~95% of their renderer code: find figures of class X, skip ones
  // already rendered (via dataset marker), lazy-load library scripts,
  // find/create the sibling target div, parse the body, call render,
  // register in the WeakMap. The dispatch table below names the
  // library URLs + the render call; the generic renderFigureType()
  // does everything else. Adding a new chart library is now ~20 lines
  // instead of ~80.
  //
  // Music figures (3 libs, 2 render targets per ABC chart) and data
  // figures (2 script types, shape detection inside) don't fit the
  // simple shape; they keep their specialized renderers above.
  const FIGURE_TYPES = new Map();

  FIGURE_TYPES.set('diagram', {
    scriptType: 'text/x-mermaid',
    targetClass: 'mermaid-render',
    markerKey: 'amDiagramSource',
    libraries: ['https://cdn.jsdelivr.net/npm/mermaid@10.9.0/dist/mermaid.min.js'],
    // Mermaid source is a DSL string, not JSON — pass through verbatim.
    parse: (s) => s,
    init: () => {
      if (window.mermaid && !window.__doc.__mermaidInitialized) {
        // startOnLoad:false keeps mermaid from auto-scanning the DOM —
        // we drive it via render() per figure. securityLevel:'strict'
        // sanitizes any HTML inside diagram labels.
        window.mermaid.initialize({
          startOnLoad: false,
          securityLevel: 'strict',
          theme: 'default',
        });
        window.__doc.__mermaidInitialized = true;
      }
    },
    render: async (target, source) => {
      _mermaidCounter += 1;
      const id = 'mermaid-svg-' + _mermaidCounter;
      const { svg } = await window.mermaid.render(id, source);
      target.innerHTML = svg;
      return { kind: 'mermaid', instance: window.mermaid, source };
    },
  });

  FIGURE_TYPES.set('plot', {
    scriptType: 'application/json',
    targetClass: 'plot-render',
    markerKey: 'amPlotSource',
    // Plotly basic bundle: scatter / bar / line / pie / area, ~600KB.
    // Full bundle (~3.5MB) adds 3D / choropleth / contour — docs that
    // need those can load it themselves via a doc-local <script src>.
    libraries: ['https://cdn.plot.ly/plotly-basic-3.0.1.min.js'],
    parse: JSON.parse,
    // Plotly retains per-div state (resize listeners, event bindings);
    // purge before re-render to keep them from accumulating.
    purge: (target) => { try { window.Plotly.purge(target); } catch (_) {} },
    render: async (target, parsed, source) => {
      // Body shape: either a full {data, layout, config} or a bare data array.
      const data = Array.isArray(parsed) ? parsed : (parsed.data || []);
      const layout = Array.isArray(parsed) ? {} : (parsed.layout || {});
      const config = Array.isArray(parsed) ? {} : (parsed.config || {});
      const mergedConfig = Object.assign(
        { responsive: true, displaylogo: false }, config,
      );
      await window.Plotly.newPlot(target, data, layout, mergedConfig);
      return { kind: 'plotly', instance: window.Plotly, source, target };
    },
  });

  FIGURE_TYPES.set('vega', {
    scriptType: 'application/json',
    targetClass: 'vega-render',
    markerKey: 'amVegaSource',
    libraries: [
      'https://cdn.jsdelivr.net/npm/vega@5',
      'https://cdn.jsdelivr.net/npm/vega-lite@5',
      'https://cdn.jsdelivr.net/npm/vega-embed@6',
    ],
    parse: JSON.parse,
    render: async (target, spec, source) => {
      const result = await window.vegaEmbed(target, spec, {
        actions: false,
        renderer: 'canvas',
      });
      return { kind: 'vega', instance: result.view, source, target };
    },
  });

  async function renderFigureType(root, figureClass) {
    const cfg = FIGURE_TYPES.get(figureClass);
    if (!cfg) return;
    const scripts = Array.from(root.querySelectorAll(
      `figure.${figureClass} script[type="${cfg.scriptType}"]`
    ));
    // preserveStructuralBlocks injects <!--am:keep--> in place of blank
    // lines (to keep CommonMark's type-6 HTML block intact). Strip them
    // before parsing AND before comparing against the dataset marker —
    // otherwise the marker (post-strip) wouldn't match textContent
    // (with sentinels) and we'd loop forever re-rendering.
    const normalize = (s) => (s || '').replace(/<!--am:keep-->/g, '').trim();
    const todo = scripts.filter(s =>
      s.dataset[cfg.markerKey] !== normalize(s.textContent)
    );
    if (!todo.length) return;
    try {
      for (const url of cfg.libraries) await loadScriptOnce(url);
    } catch (e) {
      console.warn(`${figureClass} libraries failed to load:`, e);
      return;
    }
    if (cfg.init) cfg.init();
    for (const script of todo) {
      const source = normalize(script.textContent);
      script.dataset[cfg.markerKey] = source;
      let target = script.nextElementSibling;
      if (!target || !target.classList.contains(cfg.targetClass)) {
        target = document.createElement('div');
        target.className = cfg.targetClass;
        script.parentNode.insertBefore(target, script.nextSibling);
      } else if (cfg.purge) {
        cfg.purge(target);
      } else {
        target.innerHTML = '';
      }
      if (!source) {
        target.innerHTML =
          `<div class="error-banner">${figureClass} source is empty.</div>`;
        continue;
      }
      let parsed;
      try {
        parsed = cfg.parse(source);
      } catch (e) {
        target.innerHTML =
          `<div class="error-banner">${figureClass} parse failed: `
          + ((e && e.message) || e) + '</div>';
        continue;
      }
      try {
        const registration = await cfg.render(target, parsed, source);
        const fig = script.closest('figure');
        if (fig && registration) FIGURE_RENDERERS.set(fig, registration);
      } catch (e) {
        target.innerHTML =
          `<div class="error-banner">${figureClass} render failed: `
          + ((e && e.message) || e) + '</div>';
      }
    }
  }

  // ---- End generic figure renderer ----------------------------------------

  function renderMath(root) {
    const target = root || body;
    if (window.renderMathInElement) {
      protectMathSource(target);
      window.renderMathInElement(target, {
        delimiters: [
          { left: '$$', right: '$$', display: true },
          { left: '$', right: '$', display: false },
        ],
        throwOnError: false,
        ignoredTags: ['script','noscript','style','textarea','pre','code'],
      });
    } else if (target === body) {
      // KaTeX hasn't loaded yet — retry the doc-wide bootstrap.
      // Scoped re-renders don't retry; the doc-wide initial pass
      // will pick up unrendered math on its next tick.
      setTimeout(renderMath, 60);
    }
  }

  // ---- turndown: HTML -> markdown for round-trip inline edits -----------
  // Without this, inline edit replaces the entire block's markdown source
  // with the plain-text content of the block — fine for simple prose, but
  // any `**bold**`, `_italic_`, `[link]`, `` `code` `` in the block gets
  // clobbered into plain text on the next blur. turndown converts the
  // edited HTML back into markdown, so inline emphasis survives.
  //
  // Custom rule for `.am-math-keep` reads the `data-source` attribute set
  // by protectMathSource so `$x^2$` and friends round-trip intact instead
  // of becoming raw KaTeX HTML in the source.
  let _turndown = null;
  function getTurndown() {
    if (_turndown !== null) return _turndown;
    if (!window.TurndownService) { _turndown = false; return null; }
    const td = new window.TurndownService({
      headingStyle: 'atx',
      bulletListMarker: '-',
      codeBlockStyle: 'fenced',
      emDelimiter: '_',
      strongDelimiter: '**',
      linkStyle: 'inlined',
    });
    td.addRule('am-math-keep', {
      filter: function (node) {
        return node.nodeType === 1
          && node.classList && node.classList.contains('am-math-keep');
      },
      replacement: function (content, node) {
        return node.getAttribute('data-source') || content;
      },
    });
    _turndown = td;
    return td;
  }

  function blockToMarkdown(block) {
    const td = getTurndown();
    if (!td) return block.innerText;
    try {
      return td.turndown(block.innerHTML).trim();
    } catch (e) {
      return block.innerText;
    }
  }

  // ---- Block / selection / insertion -------------------------------------
  // Predicate for "selectable block". A reader-meaningful unit the agent
  // can be focused on. Includes wrappers (figure, section, details, ...)
  // AND content (p, headings, blockquote, list, ...) — both levels can
  // be selected, click default = deepest, Alt+click escalates one level.
  // Excludes inline elements, interactive widgets, and the hidden
  // agent-skill meta sections.
  const SELECTABLE_TAGS = new Set([
    'H1', 'H2', 'H3', 'H4', 'H5', 'H6',
    'P', 'UL', 'OL', 'BLOCKQUOTE', 'TABLE', 'PRE', 'HR',
    'FIGURE', 'ASIDE', 'SECTION', 'DETAILS', 'ARTICLE', 'DIV',
  ]);
  function isSelectable(el) {
    if (!el || el === body || el.nodeType !== Node.ELEMENT_NODE) return false;
    if (!SELECTABLE_TAGS.has(el.tagName)) return false;
    if (el.classList && el.classList.contains('agent-skill')) return false;
    return true;
  }
  function findBlock(el) {
    // Deepest selectable ancestor. Used by hover, focusin, and (default
    // path of) click. Replaces the old "direct child of <article#body>"
    // rule that broke any time a wrapper like <details> nested content.
    let c = el;
    while (c && c !== body) {
      if (isSelectable(c)) return c;
      c = c.parentElement;
    }
    return null;
  }
  function findBlockChain(el) {
    // All selectable ancestors, deepest first. Used by Alt+click to
    // escalate from a currently-selected block to its parent block.
    const chain = [];
    let c = el;
    while (c && c !== body) {
      if (isSelectable(c)) chain.push(c);
      c = c.parentElement;
    }
    return chain;
  }
  // Source-equivalent text: like textContent, but for am-math-keep spans
  // emit the `data-source` (the original `$...$` / `$$...$$`) instead of
  // the rendered KaTeX glyph soup. This makes blockInfo's excerpt match
  // the markdown source byte-for-byte where math is concerned, so backend
  // signature-matching can locate the source span unambiguously.
  function sourceEquivalentText(el) {
    let out = '';
    for (const child of el.childNodes) {
      if (child.nodeType === Node.TEXT_NODE) {
        out += child.nodeValue;
      } else if (child.nodeType === Node.ELEMENT_NODE) {
        if (child.classList && child.classList.contains('am-math-keep')) {
          out += child.getAttribute('data-source') || '';
        } else {
          out += sourceEquivalentText(child);
        }
      }
    }
    return out;
  }

  function blockInfo(el) {
    const t = el.dataset.trackId || null;
    const a = el.id || null;
    const id = t || a || null;
    let label = '';
    const h = el.querySelector(':scope>h1,:scope>h2,:scope>h3,:scope>h4,:scope>h5,:scope>h6');
    const labelSource = h ? sourceEquivalentText(h) : sourceEquivalentText(el);
    label = labelSource.replace(/\s+/g, ' ').trim().slice(0, 60);
    const excerpt = sourceEquivalentText(el)
      .replace(/\s+/g, ' ').trim().slice(0, 2000);
    return { id, track_id: t, anchor_id: a, label, excerpt };
  }
  function keyOf(el) {
    const t = el.dataset.trackId;
    if (t) return 't:' + t;
    const a = el.id;
    if (a) return 'a:' + a;
    const x = el.textContent.replace(/\s+/g, ' ').trim().slice(0, 200);
    return 'x:' + x;
  }
  const selectedKeys = new Set();
  function applySelection() {
    // Walk every selectable descendant, not just body.children. After
    // the structural-block default flipped, selected blocks routinely
    // live inside <details>/<section>/<figure>/etc., and applying the
    // .selected-block class only at the top level would leave nested
    // selections invisible even when click correctly picked them.
    const all = body.querySelectorAll(
      'h1, h2, h3, h4, h5, h6, p, ul, ol, blockquote, table, pre, hr, '
      + 'figure, aside, section, details, article, div'
    );
    for (const el of all) {
      if (!isSelectable(el)) continue;
      if (selectedKeys.has(keyOf(el))) el.classList.add('selected-block');
      else el.classList.remove('selected-block');
    }
  }

  let insertionMarker = null;
  function clearInsertionMarker() {
    if (insertionMarker) { insertionMarker.remove(); insertionMarker = null; }
  }
  function findInsertionPosition(y) {
    let before = null, after = null;
    for (const ch of body.children) {
      if (ch === insertionMarker) continue;
      const r = ch.getBoundingClientRect();
      if (r.bottom <= y) before = ch;
      else if (r.top >= y) { after = ch; break; }
    }
    return { before, after };
  }
  function setInsertionMarker(beforeEl, afterEl) {
    clearInsertionMarker();
    insertionMarker = document.createElement('div');
    insertionMarker.className = 'insertion-marker';
    if (afterEl) body.insertBefore(insertionMarker, afterEl);
    else if (beforeEl) {
      if (beforeEl.nextSibling) body.insertBefore(insertionMarker, beforeEl.nextSibling);
      else body.appendChild(insertionMarker);
    } else body.appendChild(insertionMarker);
  }

  // postMessage helper that always targets a known parent origin once we
  // know it. Before `hello` we fall back to '*' so the initial handshake
  // can reach the parent regardless of its origin.
  function toParent(msg) {
    parent.postMessage(msg, PARENT_ORIGIN || '*');
  }

  // ---- Inline edit (plaintext-only) --------------------------------------
  // When the agent is idle, paragraphs and headings become contenteditable
  // so the reader can correct typos, rewrite a sentence, etc., without
  // routing through the chat. When the agent starts a turn, edits are
  // locked. /cancel is the escape hatch if a turn gets stuck.
  //
  // Plaintext-only: the reader changes *text*, not formatting. Bold /
  // italic / link markup in the source is replaced on commit if the
  // reader touches that block. Source view is the path for formatting
  // edits and for non-prose blocks (lists, code, tables).
  let editableMode = true;
  const EDITABLE_TAGS = new Set(['P', 'H1', 'H2', 'H3', 'H4', 'H5', 'H6']);

  function applyEditableMode() {
    // Walk all p/heading DESCENDANTS, not just direct body.children.
    // Docs nest blocks inside <details>/<section>/<aside>/etc. and the
    // reader still wants to inline-edit a paragraph that lives inside
    // a collapsible week or inside a theorem section.
    //
    // Skip set:
    //   - .agent-skill — hidden meta section, never reader-editable
    //   - summary — the summary IS its own click affordance
    //     (toggles collapse), can't double as edit target
    //   - figure — agent-built widgets live here and they own their
    //     internal text. Inline-editing inside a figure tends to
    //     break the figure's serialization (the agent rebuilds from
    //     the source, not from the live DOM). The toggle was also a
    //     real bug source: every agent turn-start/end re-toggled
    //     contenteditable on every <p>/<h> in the figure, which
    //     caused layout micro-shifts in the figure's chrome (the
    //     transposition-widget bug surfaced this).
    const blocks = body.querySelectorAll('p, h1, h2, h3, h4, h5, h6');
    for (const block of blocks) {
      if (block.closest('.agent-skill, summary, figure')) continue;
      if (editableMode && EDITABLE_TAGS.has(block.tagName)) {
        block.setAttribute('contenteditable', 'plaintext-only');
      } else {
        block.removeAttribute('contenteditable');
      }
    }
  }

  function setEditable(on) {
    editableMode = !!on;
    applyEditableMode();
  }

  // Snapshot the block's original blockInfo signature when it gains focus.
  // The signature (label / excerpt) is derived from the block's text, so
  // capturing AFTER the edit makes the backend unable to find the source
  // block. We stash the pre-edit signature on the element via a WeakMap.
  const _editFocusInfo = new WeakMap();

  // Tight contract for inline-edit eligibility — must match the
  // attribute applyEditableMode sets AND be a tag we registered. Widgets
  // can legitimately use `contenteditable=true` or `contenteditable=""`
  // on their own custom editor elements (a JSON editor, a label
  // rename, etc.); those should NOT route through AM's block-edit
  // pipeline. Without this narrowing, focusin on a widget's editor
  // would capture state and focusout would POST /edit-block — which
  // the backend rejects because the widget element isn't a paragraph
  // or heading in the source markdown, producing the user-facing
  // "could not locate or refusing to inline-edit this block" error.
  function isAmInlineEditTarget(block) {
    if (!block) return false;
    if (!EDITABLE_TAGS.has(block.tagName)) return false;
    if (block.getAttribute('contenteditable') !== 'plaintext-only') return false;
    // Don't inline-edit blocks that contain interactive widget elements
    // (buttons, inputs, custom contenteditables). Markdown-it can wrap a
    // widget's body in <p> during structural-block recursive render —
    // when the widget's JS mutates its readout/state, the wrapping <p>'s
    // textContent changes, focusout fires, and /edit-block POSTs a
    // signature the backend can't locate (buttons aren't in the source).
    // The root-cause fix is in the renderer; this is a belt that catches
    // future cases regardless.
    if (block.querySelector(
      'button, input, select, textarea, [contenteditable], canvas, svg'
    )) {
      return false;
    }
    return true;
  }

  body.addEventListener('focusin', e => {
    const block = findBlock(e.target);
    if (!isAmInlineEditTarget(block)) return;
    if (!_editFocusInfo.has(block)) {
      _editFocusInfo.set(block, {
        origMarkdown: blockToMarkdown(block),
        sig: blockInfo(block),
      });
    }
  });

  body.addEventListener('focusout', e => {
    const block = findBlock(e.target);
    if (!block) return;
    const info = _editFocusInfo.get(block);
    if (!info) return;
    const next = blockToMarkdown(block);
    _editFocusInfo.delete(block);
    if (next.trim() === info.origMarkdown.trim()) return;
    // Drop the new markdown + the pre-edit signature to the parent. The
    // parent POSTs to /edit-block, the backend writes through snapshot +
    // validate. turndown gives us bold / italic / inline-code / links /
    // math (via am-math-keep) preserved across the edit; whatever the
    // browser puts in the DOM that turndown can't handle falls through
    // as its underlying text.
    toParent({
      type: 'block_edit',
      block: info.sig,
      new_text: next,
    });
  });

  // Distinguish "click to focus a block" from "click-and-drag to select
  // text" by checking the selection state at click time. By the time the
  // click event fires, mousedown→mousemove→mouseup has already populated
  // the selection if the user dragged; if there's a non-collapsed
  // selection now, the click is part of a text-select gesture and we
  // leave the browser's native selection / copy behavior alone. Without
  // this, the previous handler called removeAllRanges() unconditionally
  // and killed text selection entirely — users couldn't even copy a
  // paragraph.
  function userIsTextSelecting() {
    const s = document.getSelection();
    if (!s || s.isCollapsed) return false;
    const txt = s.toString();
    return typeof txt === 'string' && txt.trim().length > 0;
  }

  document.addEventListener('click', e => {
    if (e.target.closest('a')) return;
    // Interactive widgets the agent might inject via <script> (a dark-
    // mode toggle button, a slider, a form input, a <details> summary,
    // etc.) should behave like widgets — the click runs the widget's
    // own handler and nothing else. Without this guard, we'd try to
    // treat the click as block-selection: building a blockInfo from
    // the widget (which has no source line), sending it to the parent,
    // which then fails inline-edit with "could not locate this block."
    // <a> is already handled above; this covers the rest of the
    // standard interactive set.
    if (e.target.closest('button, input, select, textarea, summary, label')) return;
    if (userIsTextSelecting()) return; // let native selection survive
    // Default click = deepest selectable. Alt+click escalates one level
    // up the selectable chain when there's exactly one block currently
    // selected and the click lands inside it. Repeated Alt+clicks walk
    // further up. Falls back to deepest if there's no escalation context
    // (no selection, multiple selected, or click outside current).
    const chain = findBlockChain(e.target);
    let b = chain[0] || null;
    const add = e.shiftKey || e.metaKey || e.ctrlKey;
    const escalate = e.altKey;
    if (escalate && selectedKeys.size === 1 && chain.length > 1) {
      const currentKey = [...selectedKeys][0];
      const idx = chain.findIndex(el => keyOf(el) === currentKey);
      if (idx >= 0 && idx + 1 < chain.length) {
        b = chain[idx + 1];
      }
    }
    // preventDefault would cancel caret-placement on a contenteditable
    // block, breaking inline edit. Block-focus still fires either way;
    // for editable blocks the browser also places the caret naturally.
    const isEditable = b && b.hasAttribute('contenteditable');
    if (!isEditable) e.preventDefault();
    if (b) b.classList.remove('hover-block');
    if (b) {
      clearInsertionMarker();
      // Alt+click always replaces — escalation is a single-block intent;
      // combining it with additive (Shift) would be ambiguous.
      if (escalate || !add) { selectedKeys.clear(); selectedKeys.add(keyOf(b)); }
      else { const k = keyOf(b); if (selectedKeys.has(k)) selectedKeys.delete(k); else selectedKeys.add(k); }
      applySelection();
      toParent({ type: 'selection', block: blockInfo(b), additive: add && !escalate });
      return;
    }
    if (e.target.closest('article#body')) {
      selectedKeys.clear();
      applySelection();
      const pos = findInsertionPosition(e.clientY);
      setInsertionMarker(pos.before, pos.after);
      toParent({
        type: 'insert_click',
        before: pos.before ? blockInfo(pos.before) : null,
        after: pos.after ? blockInfo(pos.after) : null,
      });
      return;
    }
    selectedKeys.clear();
    clearInsertionMarker();
    applySelection();
    toParent({ type: 'selection', block: null, additive: add });
  });

  body.addEventListener('mouseover', e => {
    const b = findBlock(e.target);
    if (b && !selectedKeys.has(keyOf(b))) b.classList.add('hover-block');
  });
  body.addEventListener('mouseout', e => {
    const b = findBlock(e.target);
    if (b) b.classList.remove('hover-block');
  });
  document.addEventListener('dragover', e => {
    e.preventDefault();
    if (e.dataTransfer) e.dataTransfer.dropEffect = 'copy';
  });
  document.addEventListener('drop', e => {
    e.preventDefault();
    const fs = e.dataTransfer && Array.from(e.dataTransfer.files || []);
    if (fs && fs.length) toParent({ type: 'fileDropped', files: fs });
  });
  document.addEventListener('dragenter', () => {
    toParent({ type: 'dragenter' });
  });

  // setContent: snapshot scripts → morphdom-diff into body → cleanups for
  // removed scripts → reExec new scripts → re-apply selection & math.
  // Unchanged content stays in place so scroll, in-progress canvas
  // animations, and event listeners survive the edit.
  function setContent(html, metaTxt) {
    const se = document.scrollingElement || document.documentElement;
    const sy = se.scrollTop;
    clearInsertionMarker();
    const oldScripts = new Map();
    body.querySelectorAll('script').forEach(s => oldScripts.set(scriptKey(s), s));
    const tmp = document.createElement('article');
    tmp.id = 'body';
    tmp.innerHTML = html || '';
    if (window.morphdom) {
      window.morphdom(body, tmp, {
        childrenOnly: true,
        onBeforeElUpdated(f, t) {
          // Music blocks: when the source hasn't changed, leave the
          // rendered notation alone instead of letting morphdom overwrite
          // it with the raw markdown source. We re-render only when the
          // source genuinely differs.
          if (f.dataset && f.dataset.amMusicSource !== undefined) {
            const newSource = (t.textContent || '').trim();
            if (f.dataset.amMusicSource === newSource) return false;
          }
          if (f.isEqualNode(t)) return false;
          // Preserve runtime `data-am-*` markers across the diff.
          // The figure renderers (data, music, plot, vega, diagram)
          // tag their source `<script>`/`<div>` elements with a marker
          // attribute (`data-am-data-source`, `data-am-music-source`,
          // etc.) after a successful render. The renderer's filter
          // then skips elements where marker === textContent, so an
          // unrelated edit elsewhere in the doc doesn't blow away an
          // already-rendered figure. The markers never appear in the
          // source markdown — they're runtime-only — so morphdom's
          // default reconciliation would strip them from `f` because
          // `t` doesn't have them. Re-attaching them onto `t` before
          // morphdom proceeds keeps them in the live DOM and the skip
          // logic continues to work. Without this, an edit anywhere
          // in the doc force-re-instantiates every figure's renderer,
          // dropping any agent-set runtime state (Tabulator
          // rowFormatter, Plotly chart customizations, etc.) the
          // doc author can't reach from pure markdown.
          //
          // TODO: deeper fix — move renderer markers from `data-am-*`
          // attributes to a module-private WeakMap keyed by the
          // script element. WeakMap entries survive morphdom diffs
          // for free (morphdom preserves element identity; only
          // attributes and children are reconciled), which would
          // eliminate this preservation block entirely and also keep
          // exported HTML clean of runtime bookkeeping. Worth doing
          // the next time a figure renderer is touched for an
          // unrelated reason — don't make a special trip.
          if (f.attributes) {
            for (const attr of f.attributes) {
              if (attr.name.startsWith('data-am-')
                  && !t.hasAttribute(attr.name)) {
                t.setAttribute(attr.name, attr.value);
              }
            }
          }
          return true;
        },
        onBeforeNodeDiscarded(node) {
          // Runtime-generated render targets aren't in the markdown
          // source — renderMusicBlocks creates them as siblings of the
          // music script/div. Without this keep-rule, every agent edit
          // strips the rendered notation: morphdom sees the new HTML
          // doesn't contain the target div, drops it, and the music
          // visibly disappears until OSMD/abcjs runs again (and stays
          // gone forever if dataset.amMusicSource was preserved and
          // renderMusicBlocks short-circuits).
          if (node && node.classList) {
            if (node.classList.contains('musicxml-render')) return false;
            if (node.classList.contains('abc-notation'))   return false;
            if (node.classList.contains('abc-audio'))      return false;
            if (node.classList.contains('data-grid'))      return false;
            if (node.classList.contains('mermaid-render')) return false;
            if (node.classList.contains('plot-render'))    return false;
            if (node.classList.contains('vega-render'))    return false;
          }
          return true;
        },
      });
    } else {
      body.innerHTML = html || '';
    }
    meta.textContent = metaTxt || '';
    annotateHs(body);
    attachIds(body);
    // Render math BEFORE doc scripts run. KaTeX wraps each `$...$` in a
    // `.katex` span and protectMathSource wraps the source in
    // `.am-math-keep`. Doc scripts that walk text nodes (snake-game-on-
    // the-page, word counters, falling-letters effects, etc.) can then
    // safely exclude those classes — the existing `EXCLUDE_SEL`s already
    // list `.katex` / `.katex-display`. Without this order the math text
    // gets shredded into one-character spans before KaTeX can detect
    // `$...$`, and every equation renders as literal source.
    //
    // Trade-off: a doc script that *dynamically inserts* `$...$` via
    // innerHTML and expects auto-render will no longer get rendered (math
    // has already passed). The recommended pattern for that case is to
    // call window.__doc.rerender(el) after the insertion, or write into
    // a `.am-math-keep` span with the desired source — both already
    // documented affordances.
    renderMath();
    const newScripts = new Map();
    body.querySelectorAll('script').forEach(s => newScripts.set(scriptKey(s), s));
    for (const [k, s] of oldScripts) { if (!newScripts.has(k)) runScriptCleanups(s); }
    for (const [k, s] of newScripts) { if (!oldScripts.has(k)) reExec(s); }
    applySelection();
    applyEditableMode();
    renderMusicBlocks(body).catch(e => console.warn('music render:', e));
    renderDataBlocks(body).catch(e => console.warn('data render:', e));
    // Generic-renderer figure types (plot, vega, diagram, ...).
    for (const cls of FIGURE_TYPES.keys()) {
      renderFigureType(body, cls).catch(
        e => console.warn(`${cls} render:`, e)
      );
    }
    se.scrollTop = sy;
  }

  window.addEventListener('message', e => {
    // First message must be a `hello` that locks in the parent's origin.
    // After that we only honor messages from that exact origin.
    if (PARENT_ORIGIN === null) {
      if (e.data && e.data.type === 'hello' && typeof e.origin === 'string' && e.origin.length) {
        PARENT_ORIGIN = e.origin;
      } else {
        return;
      }
    } else if (e.origin !== PARENT_ORIGIN) {
      return;
    }

    const d = e.data || {};
    if (d.type === 'setContent') {
      if (d.baseHref) {
        const b = document.getElementById('doc-base');
        if (b) b.href = d.baseHref;
      }
      setContent(d.html, d.meta);
    } else if (d.type === 'setSelections') {
      selectedKeys.clear();
      for (const sel of (d.selections || [])) {
        if (!sel) continue;
        if (sel.track_id) selectedKeys.add('t:' + sel.track_id);
        else if (sel.anchor_id) selectedKeys.add('a:' + sel.anchor_id);
        else if (sel.excerpt) selectedKeys.add(
          'x:' + String(sel.excerpt).replace(/\s+/g, ' ').trim().slice(0, 200)
        );
      }
      applySelection();
    } else if (d.type === 'clearInsertion') {
      clearInsertionMarker();
    } else if (d.type === 'setEditable') {
      setEditable(d.on);
    } else if (d.type === 'scrollToAnchor') {
      const el = document.getElementById(d.id);
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    } else if (d.type === 'print') {
      // Parent can't reach into us cross-origin to call window.print();
      // it postMessages us instead. We print our own document, which
      // gets our @media print CSS and full content flow across pages.
      window.print();
    } else if (d.type === 'theme') {
      // Parent broadcasts theme changes. We mirror on our own <html>
      // so :root[data-theme="dark"] CSS variables take effect.
      const t = d.theme === 'dark' ? 'dark' : 'light';
      if (t === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
      else document.documentElement.removeAttribute('data-theme');
    }
  });

  toParent({ type: 'iframeReady' });
})();
</script>
</body>
</html>
